<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leo's Agent Office</title>
<style>
  /* ================= TASK-7.1 工作台三栏骨架（V2.0） =================
     素色骨架：只做布局、数据、交互，不做美术（梵高皮在后续任务）。
     布局铁律：整页不出纵向滚动条，三栏各自滚，顶栏 56 / 底栏 28 固定。 */
  :root {
    --bg: #0E1117;          /* 主背景 */
    --panel: #171D26;       /* 面板 */
    --card: #222B38;        /* 卡片 */
    --line: #303C4D;        /* 边线 */
    --paper: #F1EADB;       /* 纸色 · 选中步骤 / Inspector */
    --ink: #20211C;         /* 墨色 · 纸上的字 */

    --amber: #E0B341;       /* 待决策（只给决策，不做闪烁红灯） */
    --green: #6FD3A0;       /* 已完成 */
    --blue: #5B8FF9;        /* 进行中 */
    --red: #E4685D;         /* 失败 / 断连 / 文件不存在 */

    --text: #E9EEF5;
    --muted: #93A1B5;
    --faint: #66748A;
    /* 纸面上的状态色（同色系加深一档，保证对比度） */
    --ink-green: #2E7D4F;
    --ink-blue: #3D6BC4;
    --ink-amber: #8A6A1A;
    --ink-red: #B23A31;
    --ink-muted: #7A7464;

    --topbar-h: 56px;
    --statusbar-h: 28px;
    --rail-w: 60px;
    --reqs-w: 248px;
    --insp-w: 320px;
  }
  * { box-sizing: border-box; }

  /* ================= 梵高皮（点缀级） =================
     定位是「天天用的工具」，不是演示页。判断标准：连看 8 小时会不会累。
     所以星空只出现在两处：
       1) 顶栏 56px 的一条窄带（被压到 18% 亮度）
       2) 页面最底部的极窄边（和星空呼应，不干扰阅读）
     工作区（三栏）一律纯色，零纹理零图片。
     金色只给「待拍板」，不做满屏装饰。 */

  /* 顶栏的星空条：衬在顶栏底色之下，降低到几乎只是"有一点夜空感" */
  #topbar::before {
    content: "";
    position: absolute; inset: 0;
    background: url("assets/starry-night.webp") center 38% / cover no-repeat;
    opacity: .26;
    filter: saturate(.85) brightness(.72);
    pointer-events: none;
    z-index: 0;
  }
  /* 顶栏内容压在星空之上 */
  #topbar > * { position: relative; z-index: 1; }

  /* 降噪开关：一键把星空也关掉，只剩纯色 */
  body.quiet #topbar::before { opacity: 0; }

  /* 底部一条极窄的星空边，和顶栏呼应 */
  #statusbar::before {
    content: "";
    position: absolute; inset: 0;
    background: url("assets/starry-night.webp") center 92% / 1600px auto no-repeat;
    opacity: .16;
    pointer-events: none;
    z-index: 0;
  }
  #statusbar > * { position: relative; z-index: 1; }
  body.quiet #statusbar::before { opacity: 0; }

  /* 选中的步骤卡用纸张纹理（唯一用纹理的数据区，因为它是"纸"的隐喻） */
  .step-card.sel {
    background-image: url("assets/canvas-texture.webp");
    background-size: 384px 384px;
    background-blend-mode: multiply;
  }

  /* 待拍板的金色星芒点缀：只给顶栏待决策胶囊，一个就够 */
  #tb-decision::before {
    content: "";
    position: absolute; left: -9px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px;
    background: url("assets/golden-star.webp") center / contain no-repeat;
    opacity: .9;
    pointer-events: none;
  }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 13px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  button { font: inherit; color: inherit; }

  /* ================= 顶栏 56px ================= */
  #topbar {
    flex: none; height: var(--topbar-h);
    display: flex; align-items: center; gap: 12px;
    padding: 0 16px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    position: relative; z-index: 30;
  }
  .tb-logo {
    font-size: 15px; font-weight: 700; letter-spacing: .02em; white-space: nowrap;
  }
  .tb-div { width: 1px; height: 20px; background: var(--line); flex: none; }
  #tb-task {
    font-size: 13px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
    flex: 0 1 auto;
  }
  /* 待决策琥珀胶囊：0 个时整个隐藏（hidden 属性），不留空位 */
  #tb-decision {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    background: rgba(224,179,65,.12); border: 1px solid rgba(224,179,65,.5);
    color: var(--amber); border-radius: 999px;
    padding: 2px 12px 2px 20px; font-size: 12.5px; cursor: pointer; white-space: nowrap;
    position: relative;
  }
  #tb-decision:hover { background: rgba(224,179,65,.2); }
  /* 同 settings-pop：hidden 属性必须真隐藏，否则 0 待决策时留一个空琥珀壳 */
  #tb-decision[hidden] { display: none; }
  .tb-spacer { flex: 1; }
  .tb-icon {
    flex: none; display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 8px;
    background: transparent; border: 1px solid transparent; cursor: pointer;
    color: var(--muted);
  }
  .tb-icon:hover { color: var(--text); border-color: var(--line); }
  .tb-icon.on { color: var(--text); border-color: var(--line); background: var(--card); }
  .tb-icon svg { width: 17px; height: 17px; }
  #tb-search-input {
    flex: none; width: 168px; height: 30px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    color: var(--text); padding: 0 10px; font-size: 12.5px; outline: none;
  }
  #tb-search-input:focus { border-color: var(--blue); }
  /* 响应式开关：宽屏不需要，媒体查询里才显示 */
  #tb-reqs-toggle, #tb-insp-toggle { display: none; }

  /* 设置弹层：只有真功能（暂停轮询 / 立即刷新 / 连接信息） */
  #settings-pop {
    position: absolute; top: calc(var(--topbar-h) - 6px); right: 12px;
    min-width: 220px; padding: 12px 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 18px 40px rgba(0,0,0,.45);
    display: flex; flex-direction: column; gap: 8px; z-index: 31;
  }
  /* hidden 属性要真的隐藏：上面的 display:flex 会盖掉 UA 的 [hidden]{display:none} */
  #settings-pop[hidden] { display: none; }
  #settings-pop h4 { margin: 0 0 2px; font-size: 12px; color: var(--muted); letter-spacing: .08em; }
  #settings-pop .sp-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--muted); }
  #settings-pop .sp-row b { color: var(--text); font-weight: 600; }
  #settings-pop button {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 5px 12px; cursor: pointer; font-size: 12.5px;
  }
  #settings-pop button:hover { border-color: var(--muted); }

  /* ================= 主框架：导航 + 三栏 ================= */
  #frame {
    flex: 1; min-height: 0;
    display: flex; align-items: stretch;
  }

  /* ---- 导航 Rail 60px：固定，图标 + 底部专注入口 ---- */
  #rail {
    flex: none; width: var(--rail-w);
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 0; gap: 6px;
  }
  .rail-logo {
    width: 30px; height: 30px; border-radius: 8px; margin-bottom: 10px;
    display: flex; align-items: center; justify-content: center;
    background: var(--card); border: 1px solid var(--line);
    font-weight: 700; font-size: 14px; color: var(--text);
  }
  .rail-item {
    width: 48px; padding: 7px 0 5px; border-radius: 8px;
    background: transparent; border: 1px solid transparent; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--muted); font-size: 12px;
  }
  .rail-item:hover { color: var(--text); background: var(--card); }
  .rail-item svg { width: 18px; height: 18px; }
  .rail-item[aria-current] { color: var(--text); background: var(--card); border-color: var(--line); }
  .rail-spacer { flex: 1; }

  /* ---- 需求列表 248px ---- */
  #reqs {
    flex: none; width: var(--reqs-w);
    background: var(--bg); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .reqs-head {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 12px 14px 8px; font-size: 12px; color: var(--muted);
    letter-spacing: .06em;
  }
  .reqs-head b { color: var(--text); font-weight: 600; }
  #btn-overview {
    margin-left: auto; background: transparent; cursor: pointer;
    border: 1px solid var(--line); border-radius: 999px;
    color: var(--muted); font-size: 12px; padding: 1px 10px; white-space: nowrap;
  }
  #btn-overview:hover { color: var(--text); border-color: var(--muted); }
  #btn-overview.on { color: var(--bg); background: var(--muted); border-color: var(--muted); font-weight: 600; }
  #reqs-list {
    flex: 1; min-height: 0; overflow-y: auto;
    display: flex; flex-direction: column; gap: 8px; padding: 4px 12px 14px;
  }
  .req-empty { color: var(--faint); padding: 18px 6px; text-align: center; font-size: 12.5px; }
  /* 需求卡 68–80px：名称 / 状态·当前阶段 / 已完成 n/m / 细进度条 */
  .req-item {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--line);
    border-radius: 8px; padding: 9px 12px 10px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .req-item:hover { border-color: var(--muted); border-left-color: var(--muted); }
  .req-item.sel { background: #1C2532; border-color: var(--line); border-left: 3px solid var(--blue); }
  .req-name {
    font-size: 13.5px; font-weight: 700; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .req-item.sel .req-name { color: #fff; }
  .req-line2 { display: flex; align-items: center; gap: 8px; font-size: 12px; min-width: 0; }
  .req-status { display: inline-flex; align-items: center; gap: 5px; flex: none; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  .s-active .dot { background: var(--blue); }
  .s-awaiting .dot { background: var(--amber); }
  .s-queued .dot { background: var(--faint); }
  .s-delivered .dot { background: var(--green); }
  .req-status.t-active { color: var(--blue); }
  .req-status.t-awaiting { color: var(--amber); }
  .req-status.t-queued { color: var(--muted); }
  .req-status.t-delivered { color: var(--green); }
  .req-stage { color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .req-prog { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .req-bar { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 2px; }
  .req-bar i { display: block; height: 100%; background: var(--blue); border-radius: 2px; }

  /* ---- 中央交付链：自适应，唯一主工作区 ---- */
  #center {
    flex: 1; min-width: 0; min-height: 0;
    overflow-y: auto; padding: 18px 20px 24px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .ch-head { display: flex; flex-direction: column; gap: 6px; }
  .ch-title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ch-title-row h2 { margin: 0; font-size: 18px; font-weight: 700; }
  .ch-id { font-size: 12px; color: var(--faint); letter-spacing: .06em; font-weight: 600; }
  .ch-meta { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ch-bar { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; max-width: 640px; }
  .ch-bar i { display: block; height: 100%; background: var(--blue); border-radius: 2px; transition: width .3s; }

  /* 状态胶囊（居中/概览/Inspector 共用） */
  .st { display: inline-flex; align-items: center; gap: 6px; padding: 1px 10px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
  .st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .st-done { color: var(--green); background: rgba(111,211,160,.12); }
  .st-running { color: var(--blue); background: rgba(91,143,249,.14); }
  .st-awaiting { color: var(--amber); background: rgba(224,179,65,.12); }
  .st-pending { color: var(--muted); background: rgba(147,161,181,.12); }
  .st-skipped { color: var(--faint); background: rgba(102,116,138,.12); }
  .st-failed { color: var(--red); background: rgba(228,104,93,.14); }
  /* 纸面（选中卡/Inspector）上的状态色加深一档 */
  .on-paper .st-done { color: var(--ink-green); background: rgba(46,125,79,.12); }
  .on-paper .st-running { color: var(--ink-blue); background: rgba(61,107,196,.12); }
  .on-paper .st-awaiting { color: var(--ink-amber); background: rgba(138,106,26,.12); }
  .on-paper .st-pending { color: var(--ink-muted); background: rgba(122,116,100,.12); }
  .on-paper .st-skipped { color: var(--ink-muted); background: rgba(122,116,100,.12); }
  .on-paper .st-failed { color: var(--ink-red); background: rgba(178,58,49,.12); }

  /* 4 阶段横排：当前阶段高亮 */
  .phases { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .phase {
    padding: 8px 12px; border-radius: 8px;
    background: var(--panel); border: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 2px; min-width: 0;
  }
  .phase .p-name { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; }
  .phase .p-count { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .phase .p-count .c-run { color: var(--blue); }
  .phase .p-count .c-wait { color: var(--amber); }
  .phase.cur { border-color: var(--blue); background: rgba(91,143,249,.08); }
  .phase.cur .p-name { color: var(--blue); }
  .phase.fin { opacity: .82; }   /* 已完成阶段低视觉权重 */

  /* 步骤卡按阶段成列：一阶段一列，上下堆叠 */
  .cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .step-card {
    display: flex; flex-direction: column; gap: 6px; width: 100%;
    text-align: left; cursor: pointer;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px;
  }
  .step-card:hover { border-color: var(--muted); }
  .step-card.sel { background: var(--paper); border-color: #C9BFA9; color: var(--ink); }
  .sc-row1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .sc-title {
    font-size: 13px; font-weight: 700; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0;
  }
  .step-card.sel .sc-title { color: var(--ink); }
  .step-card .st { flex: none; padding: 0 8px; }
  .sc-row2 { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; }
  .step-card.sel .sc-row2 { color: var(--ink-muted); }
  .sc-by { overflow: hidden; text-overflow: ellipsis; }

  /* 概览矩阵（全部需求）：一行一个需求 */
  .ov-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .ov-table th, .ov-table td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); }
  .ov-table th { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; white-space: nowrap; }
  .ov-row { cursor: pointer; }
  .ov-row:hover td { background: rgba(91,143,249,.06); }
  .ov-row.sel td { background: rgba(91,143,249,.1); }
  .ov-cell { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ov-cell.k-done { color: var(--green); }
  .ov-cell.k-run { color: var(--blue); }
  .ov-cell.k-wait { color: var(--amber); }
  .ov-cell.k-idle { color: var(--faint); }
  .ov-block { color: var(--amber); }
  .ov-noblock { color: var(--faint); }

  /* ---- Inspector 320px：纸面 ---- */
  #inspector {
    flex: none; width: var(--insp-w);
    background: var(--paper); color: var(--ink);
    border-left: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .insp-head {
    flex: none; padding: 12px 16px;
    font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--ink-muted);
    border-bottom: 1px solid rgba(32,33,28,.15);
  }
  #insp-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 20px; }
  .insp-empty {
    margin-top: 28px; color: var(--ink-muted); font-size: 13px;
    border: 1px dashed rgba(32,33,28,.28); border-radius: 8px;
    padding: 18px 14px; text-align: center;
  }
  .ip-step { font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--ink-muted); }
  .ip-name { margin: 4px 0 2px; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ip-time { font-size: 12px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .ip-sec { margin-top: 16px; }
  .ip-sec > h4 {
    margin: 0 0 6px; font-size: 12px; font-weight: 700;
    color: var(--ink-muted); letter-spacing: .08em;
    border-bottom: 1px solid rgba(32,33,28,.12); padding-bottom: 4px;
  }
  .ip-sec .ip-v { font-size: 13.5px; }
  .ip-file {
    display: flex; align-items: baseline; gap: 8px;
    padding: 5px 0; font-size: 12.5px;
    border-bottom: 1px dashed rgba(32,33,28,.1);
  }
  .ip-file:last-child { border-bottom: none; }
  .ip-file .fm { flex: none; font-style: normal; }
  .ip-file .fn {
    min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-weight: 600;
  }
  .ip-file .fb { flex: none; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .ip-file .ft { flex: none; font-size: 12px; }
  .ip-file.miss .fm, .ip-file.miss .fn, .ip-file.miss .ft { color: var(--ink-red); }
  .ip-file.miss .fb { color: var(--ink-red); opacity: .75; }
  /* 产物可点开：给出可交互的视觉提示 */
  .ip-file[data-open-file] { cursor: pointer; border-radius: 5px; }
  .ip-file[data-open-file]:hover { background: rgba(32,33,28,.07); }

  /* ================= 文件预览弹层 ================= */
  #file-view {
    position: fixed; inset: 0; z-index: 80;
    display: none; align-items: center; justify-content: center;
    background: rgba(6,9,14,.72); backdrop-filter: blur(2px);
  }
  #file-view.open { display: flex; }
  .fv-panel {
    width: min(920px, 92vw); height: min(760px, 88vh);
    display: flex; flex-direction: column;
    background: var(--paper); color: var(--ink);
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 30px 90px rgba(0,0,0,.6);
  }
  .fv-bar {
    flex: none; display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; border-bottom: 1px solid rgba(32,33,28,.14);
    background: rgba(255,255,255,.35);
  }
  .fv-name { font-size: 13.5px; font-weight: 600; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fv-meta { font-size: 11.5px; color: var(--ink-muted); white-space: nowrap; }
  .fv-path {
    font-size: 11px; color: var(--ink-muted); padding: 0 14px 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: ui-monospace, Consolas, monospace; direction: rtl; text-align: left;
  }
  #fv-close {
    margin-left: auto; flex: none; cursor: pointer;
    background: transparent; border: 1px solid rgba(32,33,28,.25);
    border-radius: 6px; color: var(--ink); padding: 3px 12px; font-size: 12px;
  }
  #fv-close:hover { background: rgba(32,33,28,.08); }
  #fv-body {
    flex: 1; min-height: 0; overflow: auto; padding: 16px 20px 28px;
    font-size: 13px; line-height: 1.75;
  }
  #fv-body pre {
    margin: 0; white-space: pre-wrap; word-break: break-word;
    font: 12.5px/1.7 ui-monospace, Consolas, "Microsoft YaHei", monospace;
  }
  #fv-body img { max-width: 100%; height: auto; display: block; margin: 0 auto; }
  #fv-body .fv-msg { color: var(--ink-muted); font-size: 13px; }
  #fv-body .fv-warn {
    margin-bottom: 12px; padding: 7px 10px; border-radius: 6px;
    background: rgba(178,58,49,.1); color: var(--ink-red); font-size: 12px;
  }
  .ip-link { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; }
  .ip-link .arr { color: var(--ink-muted); flex: none; }
  .ip-link .ln { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .ip-link .ls { flex: none; font-size: 12px; color: var(--ink-muted); }
  .ip-link .ls.k-done { color: var(--ink-green); }
  .ip-link .ls.k-awaiting { color: var(--ink-amber); }
  .ip-link .ls.k-running { color: var(--ink-blue); }
  .ip-link .ls.k-failed { color: var(--ink-red); }
  .ip-note { margin: 0; font-size: 13px; line-height: 1.65; color: #3F3B30; overflow-wrap: anywhere; }
  .ip-none { color: var(--ink-muted); font-size: 13px; }

  /* ================= 底部状态栏 28px ================= */
  #statusbar {
    flex: none; height: var(--statusbar-h);
    display: flex; align-items: center; gap: 18px;
    padding: 0 16px;
    background: var(--panel); border-top: 1px solid var(--line);
    font-size: 12px; color: var(--muted);
    white-space: nowrap; overflow: hidden;
    position: relative; z-index: 30;
  }
  #sb-conn { display: inline-flex; align-items: center; gap: 6px; }
  #sb-conn .dot { background: var(--green); }
  #sb-conn.off { color: var(--red); }
  #sb-conn.off .dot { background: var(--red); }
  #sb-sync { margin-left: auto; color: var(--faint); font-variant-numeric: tabular-nums; }

  /* ================= 专注模式抽屉（EaseDraw） =================
     覆盖不挤压；关闭用 display:none 保留 iframe，不重载。 */
  #focus-drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 60;
    /* 默认 560 而非 720：专注模式够用，还能留出 Inspector。
       1440 屏上 720 会盖掉右半屏，等于"专注时看不见工作台"。 */
    width: 560px; max-width: 100vw;
    display: none; flex-direction: row;
    background: var(--bg); border-left: 1px solid var(--line);
    box-shadow: -24px 0 60px rgba(0,0,0,.5);
  }
  .fd-grip {
    flex: none; width: 7px; cursor: col-resize;
    background: var(--line);
    display: flex; align-items: center; justify-content: center;
  }
  .fd-grip::after {
    content: ""; width: 2px; height: 36px; border-radius: 2px;
    background: var(--bg);
  }
  .fd-grip:hover::after, .fd-grip.dragging::after { background: var(--blue); }
  .fd-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .fd-bar {
    flex: none; height: 34px;
    display: flex; align-items: center; gap: 10px;
    padding: 0 12px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    font-size: 12.5px; color: var(--muted);
  }
  .fd-bar b { color: var(--text); font-weight: 600; }
  #fd-close {
    margin-left: auto; background: transparent; cursor: pointer;
    border: 1px solid var(--line); border-radius: 6px;
    color: var(--muted); padding: 2px 10px; font-size: 12px;
  }
  #fd-close:hover { color: var(--text); border-color: var(--muted); }
  #fd-frame { flex: 1; border: none; width: 100%; background: #fff; }

  /* ================= Agent 抽屉 ================= */
  /* 左滑出，宽度 420；点单个 Agent 展开其工作明细（右侧再推一层 320）。 */
  #agent-drawer {
    position: fixed; top: var(--topbar-h); left: var(--rail-w); bottom: var(--statusbar-h);
    width: 420px; max-width: calc(100vw - var(--rail-w));
    z-index: 50; display: none; flex-direction: column;
    background: var(--panel); border-right: 1px solid var(--line);
    box-shadow: 20px 0 60px rgba(0,0,0,.45);
  }
  #agent-drawer.open { display: flex; }

  .ad-bar {
    flex: none; height: 44px; display: flex; align-items: center; gap: 10px;
    padding: 0 14px; border-bottom: 1px solid var(--line);
    font-size: 13px; color: var(--text);
  }
  .ad-bar b { font-weight: 600; }
  .ad-bar .ad-count { color: var(--muted); font-size: 12px; }
  #ad-close {
    margin-left: auto; background: transparent; cursor: pointer;
    border: 1px solid var(--line); border-radius: 6px;
    color: var(--muted); padding: 2px 10px; font-size: 12px;
  }
  #ad-close:hover { color: var(--text); border-color: var(--muted); }

  #ad-list { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 10px 14px; }
  .ad-agent {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 10px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; margin-bottom: 4px;
    transition: background .12s;
  }
  .ad-agent:hover { background: var(--card); border-color: var(--line); }
  .ad-agent.sel { background: #1C2532; border-color: var(--line); border-left: 3px solid var(--blue); }
  .ad-ava {
    flex: none; width: 38px; height: 38px; border-radius: 9px;
    object-fit: cover; background: var(--card); border: 1px solid var(--line);
  }
  .ad-info { flex: 1; min-width: 0; }
  .ad-name {
    font-size: 13px; color: var(--text); font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ad-meta { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .ad-dot {
    flex: none; width: 7px; height: 7px; border-radius: 50%;
    background: var(--faint);
  }
  .ad-dot.on { background: var(--green); }
  .ad-dot.busy { background: var(--green); }
  .ad-dot.off { background: var(--faint); }

  /* 单个 Agent 的工作明细：抽屉内右推一层 */
  #ad-detail {
    position: absolute; top: 44px; right: 0; bottom: 0; width: 320px;
    background: var(--bg); border-left: 1px solid var(--line);
    display: flex; flex-direction: column;
    transform: translateX(102%); transition: transform .18s ease;
  }
  #ad-detail.open { transform: none; }
  .add-head {
    flex: none; padding: 12px 14px 10px; border-bottom: 1px solid var(--line);
  }
  .add-head .add-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .add-head .add-role { font-size: 12px; color: var(--muted); margin-top: 2px; }
  #add-body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px 20px; }
  .add-sec { margin-bottom: 16px; }
  .add-sec h4 {
    margin: 0 0 7px; font-size: 11.5px; font-weight: 600;
    color: var(--faint); letter-spacing: .04em; text-transform: uppercase;
  }
  .add-kv { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; padding: 3px 0; }
  .add-kv span:first-child { color: var(--muted); }
  .add-kv span:last-child { color: var(--text); font-variant-numeric: tabular-nums; }
  .add-run {
    padding: 7px 9px; border-radius: 7px; background: var(--card);
    border: 1px solid var(--line); margin-bottom: 5px; font-size: 12px;
  }
  .add-run .ar-top { display: flex; gap: 8px; align-items: center; }
  .add-run .ar-rule { color: var(--text); flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .add-run .ar-sum { color: var(--muted); margin-top: 3px; font-size: 11.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .add-empty { color: var(--faint); font-size: 12px; padding: 8px 0; }

  /* ================= 响应式 ================= */
  /* ≤1280：Inspector 收起，点步骤卡或顶栏按钮时覆盖式展开 */
  @media (max-width: 1280px) {
    #inspector {
      position: fixed; top: var(--topbar-h); right: 0; bottom: var(--statusbar-h);
      width: var(--insp-w); z-index: 40;
      transform: translateX(105%);
      transition: transform .18s ease;
      box-shadow: -18px 0 44px rgba(0,0,0,.4);
      border-left: 1px solid var(--line);
    }
    body.insp-open #inspector { transform: none; }
    #tb-insp-toggle { display: inline-flex; }
    #tb-insp-toggle.on { color: var(--blue); border-color: var(--blue); }
  }
  /* ≤1024：需求列表也收起，中央优先；覆盖式展开 */
  @media (max-width: 1024px) {
    #reqs {
      position: fixed; top: var(--topbar-h); left: var(--rail-w); bottom: var(--statusbar-h);
      width: var(--reqs-w); z-index: 40;
      transform: translateX(-105%);
      transition: transform .18s ease;
      box-shadow: 18px 0 44px rgba(0,0,0,.4);
    }
    body.reqs-open #reqs { transform: none; }
    #tb-reqs-toggle { display: inline-flex; }
    #tb-reqs-toggle.on { color: var(--blue); border-color: var(--blue); }
  }

/* TASK-8.2: semantic colors. Amber #E0B341 = Leo decision ONLY;
   blue #5B8FF9 = selected requirement / step / Agent / navigation;
   green #6FD3A0 = completed / online; red #E4685D = failed / broken / missing;
   gray #66748A = pending / waiting. */
:root { --agent-h:320px; --ink-muted:var(--muted); --ink-green:var(--green); --ink-blue:var(--blue); --ink-red:var(--red); }
html,body {height:100%;overflow:hidden}
body.agent-open #frame {flex:none;height:calc(100dvh - var(--topbar-h) - var(--statusbar-h) - min(var(--agent-h),60dvh));}
#agent-drawer {top:auto;left:0;right:0;bottom:var(--statusbar-h);width:100%;max-width:none;height:min(var(--agent-h),60dvh);box-shadow:none;border-top:1px solid var(--line);}
#agent-grip {height:14px;flex:none;cursor:ns-resize;touch-action:none;display:grid;place-items:center}
#agent-grip:before {content:'';width:42px;height:3px;border-radius:3px;background:var(--muted)}
#ad-list {display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-content:start;}
.ad-agent {background:var(--bg);border:1px solid var(--line);min-height:76px;margin:0}
.ad-agent.sel {border:1px solid var(--blue)}
.ad-ava {width:40px;height:40px;padding:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;filter:saturate(.85)}
#ad-detail {position:static;transform:none;width:auto;display:none;flex:1;min-height:0}
#ad-detail.open {display:flex}
#agent-drawer:has(#ad-detail.open) #ad-list {flex:0 0 100px}
#add-body {display:flex;gap:32px;padding:10px 18px;overflow:auto}
.add-sec {min-width:200px}
#inspector {background:var(--panel);color:var(--text)}
.insp-head,.insp-empty,.ip-step,.ip-time,.ip-none,.ip-sec>h4,.ip-link .arr {color:var(--muted)}
.ip-name {background:var(--paper);color:#20211C;min-height:48px;max-height:56px;padding:8px 10px;border-radius:4px;flex-wrap:nowrap;font-size:14px}
.ip-note,.ip-link .ln {color:var(--text)}
.ip-sec>h4,.ip-file,.insp-head {border-color:var(--line)}
.step-card.sel {background:var(--card);border:1px solid var(--blue);box-shadow:none;color:var(--text)}
.step-card.sel .sc-title {color:var(--text)}
.step-card.sel .sc-row2 {color:var(--muted)}
.cols {grid-template-columns:repeat(2,minmax(0,1fr))}
.col {display:contents}
.step-card {padding:14px;min-height:84px}
.step-card:not(.sel) {border-color:var(--line)}
.step-card.st-awaiting {background:var(--panel);color:var(--text)}
.phase.cur {border-color:var(--blue)}
.s-awaiting .dot {background:var(--faint)}
.req-status.t-awaiting,.phase .p-count .c-wait,.ov-block,.ov-cell.k-wait,.ip-link .ls.k-awaiting {color:var(--muted)}
.rail-item[aria-current=page],.rail-item.selected {color:var(--blue);border-color:var(--blue);background:#1c2532}
#rail .rail-spacer {display:none}
#rail-focus {margin-top:auto}
svg {stroke-width:1.6;stroke-linecap:round}
#hub {flex:1;min-height:0;overflow:auto;padding:12px 20px}
#hub[hidden] {display:none}
.hubtools,.pagination {display:flex;align-items:center;gap:12px;margin-bottom:12px}
.hubtools input {background:var(--bg);color:var(--text);border:1px solid var(--line);padding:7px;border-radius:6px}
.hubtools button,.pagination button {background:var(--card);color:var(--text);border:1px solid var(--line);padding:6px 12px;border-radius:6px;cursor:pointer}
.pagination {justify-content:space-between;margin-top:10px}
.skill-row {display:block;width:100%;text-align:left;background:var(--bg);color:var(--text);padding:9px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.skill-row.selected {border-color:var(--blue)}
.skill-row small {display:block;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hubgrid {display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.skilldetail {color:var(--text);overflow-wrap:anywhere}
.filegroup summary {padding:10px 0;cursor:pointer}
.library-file {display:flex;gap:12px;align-items:center;width:100%;padding:10px;background:var(--bg);color:var(--text);border:1px solid var(--line);text-align:left;cursor:pointer}
.library-file svg {width:20px;height:20px}.library-file small {margin-left:auto;color:var(--muted)}
@media(max-width:1280px){body.agent-open #inspector,body.agent-open #reqs {bottom:calc(var(--statusbar-h) + min(var(--agent-h),60dvh))}}

</style>
</head>
<body>

<!-- ================= 顶栏 56px ================= -->
<header id="topbar">
  <span class="tb-logo">Leo's Agent Office</span>
  <span class="tb-div"></span>
  <span id="tb-task">—</span>
  <button id="tb-decision" type="button" hidden title="点击定位到待决策的步骤"></button>
  <span class="tb-spacer"></span>
  <input id="tb-search-input" type="search" placeholder="筛选需求…" hidden autocomplete="off">
  <button id="tb-reqs-toggle" class="tb-icon" type="button" title="需求列表" aria-label="切换需求列表">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1.5 3.5h13M1.5 8h13M1.5 12.5h13"/></svg>
  </button>
  <button id="tb-insp-toggle" class="tb-icon" type="button" title="步骤详情" aria-label="切换详情面板">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 2.5h11v11h-11zM2.5 6h11M2.5 10h11"/></svg>
  </button>
  <button id="tb-search" class="tb-icon" type="button" title="搜索需求" aria-label="搜索需求">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
  </button>
  <button id="tb-settings" class="tb-icon" type="button" title="设置" aria-label="设置">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M12.4 3.6L11 5M5 11l-1.4 1.4"/></svg>
  </button>
  <div id="settings-pop" hidden>
    <h4>设置</h4>
    <div class="sp-row"><span>中台连接</span><b id="sp-conn">—</b></div>
    <div class="sp-row"><span>自动刷新</span><span><b id="sp-poll">开</b> <button id="sp-poll-btn" type="button">暂停</button></span></div>
    <div class="sp-row"><span>轮询间隔</span><b>3 秒</b></div>
    <div class="sp-row"><span>背景降噪</span><span><b id="sp-quiet">关</b> <button id="sp-quiet-btn" type="button">开启</button></span></div>
    <div class="sp-row"><button id="sp-refresh" type="button">立即刷新</button></div>
  </div>
</header>

<!-- ================= 导航 + 三栏 ================= -->
<div id="frame">
  <nav id="rail" aria-label="主导航">
    <div class="rail-logo" aria-hidden="true">L</div>
    <button id="rail-reqs" class="rail-item" aria-current="page" title="需求">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1"/><rect x="9" y="9" width="5.5" height="5.5" rx="1"/></svg>
      <span>需求</span>
    </button>
    <div class="rail-spacer"></div>
    <button id="rail-agents" class="rail-item" type="button" title="Agent 列表与工作明细">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="5.5" cy="5" r="2.2"/><circle cx="11" cy="6.5" r="1.8"/><path d="M1.6 13c.4-2.2 2-3.4 3.9-3.4s3.5 1.2 3.9 3.4"/><path d="M10.2 10c1.7 0 3 1 3.4 2.9"/></svg>
      <span>Agent</span>
    </button>
    <button id="rail-skills" class="rail-item" type="button"><span>技能</span></button><button id="rail-files" class="rail-item" type="button"><span>文件</span></button>
    <button id="rail-focus" class="rail-item" type="button" title="打开 EaseDraw 专注模式">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.2"/><path d="M8 1.8a6.2 6.2 0 010 12.4z" fill="currentColor" stroke="none"/></svg>
      <span>专注</span>
    </button>
  </nav>

  <!-- 左：需求列表 248px -->
  <aside id="reqs" aria-label="需求列表">
    <div class="reqs-head">需求 · <b id="reqs-count">—</b><button id="btn-overview" type="button">全部需求</button></div>
    <div id="reqs-list"></div>
  </aside>

  <!-- 中：交付链（自适应） -->
  <main id="center">
    <div id="center-chain"></div>
    <div id="center-overview" hidden></div>
  </main>

  <!-- 右：Inspector 320px -->
  <aside id="inspector" aria-label="步骤详情">
    <div class="insp-head">步骤详情</div>
    <div id="insp-body"></div>
  </aside>
</div>

<!-- ================= 底部状态栏 28px ================= -->
<footer id="statusbar">
  <span id="sb-conn"><i class="dot"></i><span id="sb-conn-text">连接中…</span></span>
  <span id="sb-agents">— Agents</span>
  <span id="sb-running">— 执行中</span>
  <span id="sb-idle">— 空闲</span>
  <span id="sb-sync">同步 —</span>
</footer>

<!-- ================= 文件预览弹层 ================= -->
<div id="file-view" role="dialog" aria-label="文件内容">
  <div class="fv-panel">
    <div class="fv-bar">
      <span class="fv-name" id="fv-name">—</span>
      <span class="fv-meta" id="fv-meta"></span>
      <button id="fv-close" type="button">关闭</button>
    </div>
    <div class="fv-path" id="fv-path"></div>
    <div id="fv-body"></div>
  </div>
</div>

<!-- ================= Agent 抽屉 ================= -->
<div id="agent-drawer" aria-label="Agent 列表">
  <div id="agent-grip" role="separator" tabindex="0" aria-label="调整抽屉高度" aria-orientation="horizontal"></div>
  <div class="ad-bar">
    <b>Agents</b>
    <span class="ad-count" id="ad-count">—</span>
    <button id="ad-close" type="button">关闭</button>
  </div>
  <div id="hub" hidden></div><div id="ad-list"></div>
  <div id="ad-detail">
    <div class="add-head">
      <div class="add-name" id="add-name">—</div>
      <div class="add-role" id="add-role">—</div>
    </div>
    <div id="add-body"></div>
  </div>
</div>

<!-- ================= 专注模式抽屉：覆盖式，关闭 display:none 保留 iframe ================= -->
<div id="focus-drawer" aria-label="专注模式">
  <div class="fd-grip" id="fd-grip" title="拖拽调整宽度（480–1000px）"></div>
  <div class="fd-main">
    <div class="fd-bar"><b>专注模式</b><span>· EaseDraw</span><button id="fd-close" type="button">关闭 ✕</button></div>
    <iframe id="fd-frame" src="https://luckyandease.com/easedraw/" title="EaseDraw"></iframe>
  </div>
</div>

<script>
'use strict';

// 页面 JS 异常计数（验收口径：window.__uiErrors === 0）
window.__uiErrors = 0;
window.addEventListener('error', () => { window.__uiErrors++; });

/* ================= 工具 ================= */

// 所有后端来的字符串都过这道闸再进 innerHTML
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function fmtBytes(n) {
  if (n == null || !Number.isFinite(n)) return '—';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(1) + ' MB';
}

function fmtTime(iso) {
  try {
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return '—';
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    return sameDay ? `${hh}:${mm}` : `${d.getMonth() + 1}/${d.getDate()} ${hh}:${mm}`;
  } catch { return '—'; }
}

function ago(iso) {
  const t = Date.parse(iso);
  if (!Number.isFinite(t)) return '';
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return Math.floor(s) + ' 秒前';
  if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
  if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
  return Math.floor(s / 86400) + ' 天前';
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  let body = null;
  try { body = await res.json(); } catch { /* 空体 */ }
  if (!res.ok) {
    const msg = body && body.error ? body.error : 'HTTP ' + res.status;
    throw new Error(msg);
  }
  return body;
}

// 路径归一：flow 数据里同一路径混用 \ 和 / 两种分隔符，归一后才能去重与比对
function normPath(p) { return String(p ?? '').replace(/\\/g, '/'); }

/* ================= 语义映射 ================= */

// 心跳判宽：与上一版一致（约 1 分钟一跳，2 分钟没动静才算超时）
const HEARTBEAT_TTL = 120000;

// 连接状态只回答「这台机器连着吗」，和干不干活无关
function connectionOf(agent, now) {
  if (!agent.online) return 'offline';
  const seen = Date.parse(agent.seenAt);
  if (!Number.isFinite(seen) || (now - seen) > HEARTBEAT_TTL) return 'stale';
  return 'online';
}

// 工作状态只看这个 Agent 名下的任务，与连接状态独立
function workOf(totals) {
  const t = totals || {};
  if ((t.retrying || 0) > 0) return 'retrying';
  if ((t.running || 0) > 0) return 'running';
  if ((t.queued || 0) > 0) return 'queued';
  return 'idle';
}

// 4 阶段是视觉投影，不是业务模型：已知 key 语义映射，未知 key 按序号比例摊
const PHASES = [
  { no: 1, name: '定义', keys: ['req', 'doc'] },
  { no: 2, name: '生产', keys: ['plan', 'brief', 'run'] },
  { no: 3, name: '验证', keys: ['deliverable', 'verify'] },
  { no: 4, name: '交付', keys: ['final'] },
];
function phaseIdxOf(step, idx, total) {
  for (let p = 0; p < PHASES.length; p++) {
    if (PHASES[p].keys.includes(step.key)) return p;
  }
  return Math.min(PHASES.length - 1, Math.floor(idx / Math.max(1, total) * PHASES.length));
}

// 步骤状态 → 中文标签（卡片/Inspector 同源）
const STEP_LABEL = { done: '完成', running: '进行中', awaiting: '待拍板', pending: '等待', skipped: '已跳过', failed: '失败' };

// 待决策判定（任务书口径）：awaiting，或 gate 步骤停在 pending
function isAwaiting(step) {
  return step.status === 'awaiting' || (step.gate === true && step.status === 'pending');
}

// 需求整体状态：待拍板 > 已交付 > 进行中 > 排队
function taskStatus(t) {
  const steps = t.steps || [];
  if (steps.some(isAwaiting)) return 'awaiting';
  if ((t.total || 0) > 0 && (t.done || 0) >= t.total) return 'delivered';
  if ((t.done || 0) === 0 && !steps.some((s) => s.status === 'running')) return 'queued';
  return 'active';
}
const TASK_STATUS_LABEL = { active: '进行中', awaiting: '待拍板', queued: '排队', delivered: '已交付' };

// 需求当前阶段：第一个没完成的步骤所在阶段；全部完成则最后一个阶段
function currentPhaseIdx(t) {
  const steps = t.steps || [];
  for (let i = 0; i < steps.length; i++) {
    if (steps[i].status !== 'done') return phaseIdxOf(steps[i], i, steps.length);
  }
  return PHASES.length - 1;
}

// 当前阶段文案（左侧需求卡 & 中央头部共用），如「04 交付 · 最终交付」
function currentStageText(t) {
  const steps = t.steps || [];
  for (let i = 0; i < steps.length; i++) {
    if (steps[i].status !== 'done') {
      const p = PHASES[phaseIdxOf(steps[i], i, steps.length)];
      return `0${p.no} ${p.name} · ${steps[i].name}`;
    }
  }
  const p = PHASES[PHASES.length - 1];
  return `0${p.no} ${p.name}`;
}

/* ================= 页面状态（轮询只换数据，不重置这些） ================= */

const POLL_MS = 3000;
const ui = {
  taskId: null,     // 选中的需求
  stepKey: null,    // 选中的步骤（属于 taskId）
  view: 'chain',    // 'chain' 交付链 | 'overview' 全部需求
  search: '',       // 顶栏搜索词，只筛需求列表
};
let lastState = null;      // /api/state 最后一次成功数据
let lastFlow = null;       // /api/office/flow 最后一次成功数据
let hubOnline = null;      // null 未知 / true / false
let lastSyncAt = null;     // 最后一次成功同步的时间戳
let fileStatus = new Map(); // normPath -> { exists, bytes }（服务端核实）
let fileCheckKey = '';     // 上次核实的路径集合指纹，不变就不重查
let pollTimer = null;

function currentTask() {
  if (!lastFlow) return null;
  return (lastFlow.tasks || []).find((t) => t.id === ui.taskId) || null;
}

// 数据刷新后校准选中项：任务没了就退回第一个，步骤没了就清空
function ensureSelection() {
  const tasks = (lastFlow && lastFlow.tasks) || [];
  if (!tasks.length) { ui.taskId = null; ui.stepKey = null; return; }
  if (!tasks.some((t) => t.id === ui.taskId)) {
    ui.taskId = tasks[0].id;
    ui.stepKey = null;
  }
  const t = currentTask();
  if (t && ui.stepKey != null && !t.steps.some((s) => s.key === ui.stepKey)) {
    ui.stepKey = null;
  }
}

/* ================= 轮询 ================= */

async function tick() {
  const [sR, hR, fR, kR] = await Promise.allSettled([
    api('/api/state'),
    api('/api/health'),
    api('/api/office/flow'),
    api('/api/office/skills'),
  ]);
  hubOnline = hR.status === 'fulfilled' && hR.value && hR.value.autoloop === true;
  if (sR.status === 'fulfilled') { lastState = sR.value; lastSyncAt = Date.now(); }
  if (fR.status === 'fulfilled' && fR.value) {
    lastFlow = fR.value;
    ensureSelection();
    scheduleFileCheck();   // 异步，不挡渲染
  }
  if(kR.status==='fulfilled') skillsData=kR.value.skills || [];
  renderAll();
  if(agentUI.open && drawerMode!=='agents') renderHub();
}

function startPolling() {
  if (pollTimer != null) return;
  pollTimer = setInterval(tick, POLL_MS);
}
function stopPolling() {
  if (pollTimer != null) { clearInterval(pollTimer); pollTimer = null; }
}

/* ================= 产物存在性核实（服务端，只查变化的路径集） ================= */

async function scheduleFileCheck() {
  const paths = new Set();
  for (const t of (lastFlow.tasks || [])) {
    for (const s of (t.steps || [])) for (const f of (s.files || [])) {
      const p = String(f.path || '');
      if (p) paths.add(p);
    }
  }
  const arr = [...paths];
  const key = arr.slice().sort().join('\n');
  if (key === fileCheckKey) return;
  fileCheckKey = key;
  try {
    const d = await api('/api/office/file-check', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ paths: arr }),
    });
    fileStatus = new Map((d.results || []).map((r) => [normPath(r.path), r]));
    withScroll(document.getElementById('insp-body'), renderInspector);   // 红标只影响 Inspector
  } catch {
    fileCheckKey = '';   // 失败了下轮重试；期间按「未核实」渲染（不标红也不标绿）
    fileStatus = new Map();
  }
}

// 同一步里同一路径常以 \ 和 / 两种写法登记两次，按归一路径去重
function dedupFiles(files) {
  const seen = new Set();
  const out = [];
  for (const f of files || []) {
    const np = normPath(f.path);
    if (!np || seen.has(np)) continue;
    seen.add(np);
    out.push(f);
  }
  return out;
}

/* ================= 渲染 ================= */

// innerHTML 重建但容器不动：显式保住滚动位置（三栏各自滚）
function withScroll(el, fn) {
  if (!el) { fn(); return; }
  const top = el.scrollTop;
  fn();
  el.scrollTop = top;
}

function renderAll() {
  renderTopbar();
  renderStatusbar();
  withScroll(document.getElementById('reqs-list'), renderReqList);
  withScroll(document.getElementById('center'), renderCenter);
  withScroll(document.getElementById('insp-body'), renderInspector);
  // 抽屉开着时跟着轮询刷新，否则状态会停在打开那一刻
  if (agentUI.open && drawerMode==='agents') { withScroll(document.getElementById('ad-list'), renderAgentList); withScroll(document.getElementById('add-body'), renderAgentDetail); }
}

/* ---- 顶栏 ---- */
function renderTopbar() {
  const t = currentTask();
  document.getElementById('tb-task').textContent = t ? t.title : '—';

  // 待决策琥珀胶囊：0 个完全隐藏
  const pill = document.getElementById('tb-decision');
  let n = 0;
  for (const tk of (lastFlow ? lastFlow.tasks : [])) {
    n += (tk.steps || []).filter(isAwaiting).length;
  }
  if (n > 0) {
    pill.hidden = false;
    pill.innerHTML = `⏸ <b>${n}</b> 待决策`;
  } else {
    pill.hidden = true;
  }

  // 设置弹层里的连接态
  const spConn = document.getElementById('sp-conn');
  spConn.textContent = hubOnline === true ? '在线' : hubOnline === false ? '离线' : '—';
}

/* ---- 底部状态栏 ---- */
function renderStatusbar() {
  const conn = document.getElementById('sb-conn');
  const connText = document.getElementById('sb-conn-text');
  if (hubOnline === true) { conn.classList.remove('off'); connText.textContent = '连接正常'; }
  else if (hubOnline === false) { conn.classList.add('off'); connText.textContent = '连接断开'; }
  else { conn.classList.remove('off'); connText.textContent = '连接中…'; }

  const agents = (lastState && lastState.agents) || [];
  const now = lastState ? (Date.parse(lastState.now) || Date.now()) : Date.now();
  let running = 0, idle = 0;
  for (const a of agents) {
    const w = workOf(a.totals);
    if (w === 'running' || w === 'retrying') running++;
    else if (w === 'idle' && connectionOf(a, now) !== 'offline') idle++;
  }
  document.getElementById('sb-agents').textContent = `${agents.length} Agents`;
  document.getElementById('sb-running').textContent = `${running} 执行中`;
  document.getElementById('sb-idle').textContent = `${idle} 空闲`;
}

// 同步时间每秒更新（独立于 3 秒轮询，读的是最后一次成功同步的时间戳）
setInterval(() => {
  const el = document.getElementById('sb-sync');
  el.textContent = lastSyncAt
    ? '同步 ' + new Date(lastSyncAt).toLocaleTimeString('zh-CN', { hour12: false })
    : '同步 —';
}, 1000);

/* ---- 左：需求列表 ---- */
function renderReqList() {
  const list = document.getElementById('reqs-list');
  const tasks = (lastFlow && lastFlow.tasks) || [];
  document.getElementById('reqs-count').textContent = tasks.length;

  const q = ui.search.trim().toLowerCase();
  const shown = q ? tasks.filter((t) => (t.title || '').toLowerCase().includes(q) || (t.id || '').toLowerCase().includes(q)) : tasks;

  if (!tasks.length) {
    list.innerHTML = '<div class="req-empty">还没有需求进来。<br>把需求告诉 Hermes，它会在这里建档。</div>';
    return;
  }
  if (!shown.length) {
    list.innerHTML = `<div class="req-empty">没有匹配「${esc(ui.search)}」的需求</div>`;
    return;
  }
  list.innerHTML = shown.map((t) => {
    const st = taskStatus(t);
    const pct = (t.total || 0) > 0 ? Math.round((t.done || 0) / t.total * 100) : 0;
    const stage = currentStageText(t);
    return `<button type="button" class="req-item s-${st}${t.id === ui.taskId ? ' sel' : ''}" data-task="${esc(t.id)}">
      <span class="req-name" title="${esc(t.title)}">${esc(t.title)}</span>
      <span class="req-line2">
        <span class="req-status t-${st}"><i class="dot"></i>${TASK_STATUS_LABEL[st]}</span>
        <span class="req-stage" title="${esc(stage)}">${esc(stage)}</span>
      </span>
      <span class="req-prog">已完成 ${t.done ?? 0}/${t.total ?? 0}</span>
      <span class="req-bar"><i style="width:${pct}%"></i></span>
    </button>`;
  }).join('');
}

/* ---- 中：交付链 / 概览 ---- */
function renderCenter() {
  const chain = document.getElementById('center-chain');
  const overview = document.getElementById('center-overview');
  const btn = document.getElementById('btn-overview');
  if (ui.view === 'overview') {
    chain.hidden = true;
    overview.hidden = false;
    btn.classList.add('on');
    renderOverview();
    return;
  }
  chain.hidden = false;
  overview.hidden = true;
  btn.classList.remove('on');
  renderChain();
}

// 阶段投影：把步骤按 4 阶段分列（视觉组织，不改数据）
function phasesOf(t) {
  const steps = (t.steps || []).slice().sort((a, b) => (a.no ?? 0) - (b.no ?? 0));
  return PHASES.map((p, i) => ({
    ...p,
    steps: steps.filter((s, idx) => phaseIdxOf(s, idx, steps.length) === i),
  }));
}

function renderChain() {
  const box = document.getElementById('center-chain');
  const t = currentTask();
  if (!t) {
    box.innerHTML = '<div class="req-empty">没有需求数据。等中台恢复后会自动填上。</div>';
    return;
  }
  const phases = phasesOf(t);
  const curIdx = currentPhaseIdx(t);
  const st = taskStatus(t);
  const pct = (t.total || 0) > 0 ? Math.round((t.done || 0) / t.total * 100) : 0;
  const curP = PHASES[curIdx];

  const phaseHtml = phases.map((p) => {
    const total = p.steps.length;
    const done = p.steps.filter((s) => s.status === 'done').length;
    const run = p.steps.filter((s) => s.status === 'running').length;
    const wait = p.steps.filter(isAwaiting).length;
    const fin = total > 0 && done === total;
    const parts = [`已完成 ${done}/${total}`];
    if (run > 0) parts.push(`<span class="c-run">进行中 ${run}</span>`);
    if (wait > 0) parts.push(`<span class="c-wait">待拍板 ${wait}</span>`);
    return `<div class="phase${p.no - 1 === curIdx ? ' cur' : ''}${fin ? ' fin' : ''}">
      <span class="p-name">0${p.no} ${p.name}</span>
      <span class="p-count">${parts.join(' · ')}</span>
    </div>`;
  }).join('');

  // 步骤卡按阶段成列：一阶段一列，列内上下堆叠（不搞 1/3/5/7 错位排）
  const colsHtml = phases.map((p) => {
    const cards = p.steps.map(stepCardHtml).join('');
    return `<div class="col">${cards || '<div class="req-empty">（无步骤）</div>'}</div>`;
  }).join('');

  box.innerHTML = `
    <div class="ch-head">
      <div class="ch-title-row">
        <span class="ch-id">${esc(t.id)}</span>
        <h2>${esc(t.title)}</h2>
        <span class="st st-${esc(st)}">${TASK_STATUS_LABEL[st]}</span>
      </div>
      <div class="ch-meta">已完成 ${t.done ?? 0}/${t.total ?? 0} · 当前 0${curP.no} ${curP.name}${t.updatedAt ? ' · 更新 ' + esc(fmtTime(t.updatedAt)) : ''}</div>
      <div class="ch-bar"><i style="width:${pct}%"></i></div>
    </div>
    <div class="phases">${phaseHtml}</div>
    <div class="cols">${colsHtml}</div>`;
}

// 步骤卡只放四件事：序号+名称 / 状态 / 执行者 / 产物数量
function stepCardHtml(s) {
  const st = s.status || 'pending';
  const label = STEP_LABEL[st] || st;
  const files = (s.files || []).length;
  return `<button type="button" class="step-card st-${esc(st)}${s.key === ui.stepKey ? ' sel' : ''}" data-step="${esc(s.key)}" data-task="${esc(ui.taskId)}">
    <span class="sc-row1">
      <span class="sc-title" title="${String(s.no ?? '').padStart(2, '0')} · ${esc(s.name)}">${String(s.no ?? '').padStart(2, '0')} · ${esc(s.name)}</span>
      <span class="st st-${esc(st)}">${esc(label)}</span>
    </span>
    <span class="sc-row2">
      <span class="sc-by">${s.by ? esc(s.by) : '—'}</span>
      <span>·</span>
      <span>${files > 0 ? files + ' 个产物' : '—'}</span>
    </span>
  </button>`;
}

/* ---- 中：全部需求概览（一行一个需求，点行回到交付链） ---- */
function renderOverview() {
  const box = document.getElementById('center-overview');
  const tasks = (lastFlow && lastFlow.tasks) || [];
  if (!tasks.length) {
    box.innerHTML = '<div class="req-empty">还没有需求进来。</div>';
    return;
  }
  const rows = tasks.map((t) => {
    const phases = phasesOf(t);
    const cells = phases.map((p) => {
      const total = p.steps.length;
      const done = p.steps.filter((s) => s.status === 'done').length;
      const run = p.steps.filter((s) => s.status === 'running').length;
      const wait = p.steps.filter(isAwaiting).length;
      let cls = 'k-idle', txt = `${done}/${total}`;
      if (wait > 0) { cls = 'k-wait'; txt = `⏸ ${done}/${total}`; }
      else if (run > 0) { cls = 'k-run'; txt = `${done}/${total}`; }
      else if (total > 0 && done === total) { cls = 'k-done'; txt = `✓ ${done}/${total}`; }
      return `<td class="ov-cell ${cls}">${txt}</td>`;
    }).join('');
    const block = (t.steps || []).find(isAwaiting);
    const stage = currentStageText(t);
    return `<tr class="ov-row${t.id === ui.taskId ? ' sel' : ''}" data-task="${esc(t.id)}">
      <td><b>${esc(t.title)}</b><div class="ch-id" style="margin-top:2px">${esc(t.id)}</div></td>
      ${cells}
      <td class="ov-cell">已完成 ${t.done ?? 0}/${t.total ?? 0}</td>
      <td>${block ? `<span class="ov-block">⏸ ${esc(block.name)}</span>` : '<span class="ov-noblock">无</span>'}</td>
      <td class="ov-cell">${esc(stage)}</td>
    </tr>`;
  }).join('');
  box.innerHTML = `<table class="ov-table">
    <thead><tr><th>需求</th><th>01 定义</th><th>02 生产</th><th>03 验证</th><th>04 交付</th><th>进度</th><th>当前阻塞</th><th>当前阶段</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

/* ---- 右：Inspector ---- */
function renderInspector() {
  const body = document.getElementById('insp-body');
  const t = currentTask();
  if (!t) {
    body.innerHTML = '<div class="insp-empty">点左边任意一步看详情</div>';
    return;
  }
  const steps = (t.steps || []).slice().sort((a, b) => (a.no ?? 0) - (b.no ?? 0));
  const idx = steps.findIndex((s) => s.key === ui.stepKey);
  if (idx < 0) {
    body.innerHTML = '<div class="insp-empty">点左边任意一步看详情</div>';
    return;
  }
  const s = steps[idx];
  const st = s.status || 'pending';
  const label = STEP_LABEL[st] || st;

  const files = dedupFiles(s.files).map((f) => {
    const np = normPath(f.path);
    const chk = fileStatus.get(np);           // 服务端核实结果；undefined = 还没核实到
    const exists = chk ? chk.exists === true : null;
    const realBytes = chk && chk.exists ? chk.bytes : f.bytes;   // 存在用实测字节，不存在用登记字节
    const name = np.split('/').pop();
    if (exists === false) {
      // 登记了但文件不在了：标红 + 明说，不能因为接口返回了路径就当可打开
      return `<div class="ip-file miss" title="${esc(f.path)}">
        <i class="fm">✗</i><span class="fn">${esc(name)}</span>
        <span class="fb">${fmtBytes(realBytes)}</span><span class="ft">文件不存在</span>
      </div>`;
    }
    return `<div class="ip-file" data-open-file="${esc(f.path)}" title="${esc(f.path)} &#10;点击查看内容">
      <i class="fm" style="color:var(--ink-green)">${exists === true ? '✓' : '·'}</i>
      <span class="fn">${esc(name)}</span><span class="fb">${fmtBytes(realBytes)}</span>
    </div>`;
  }).join('');

  const prev = steps[idx - 1];
  const next = steps[idx + 1];
  const linkHtml = (step, arrow) => {
    if (!step) return `<div class="ip-link"><span class="arr">${arrow}</span><span class="ln ip-none">—</span></div>`;
    const ls = step.status || 'pending';
    const k = ls === 'done' ? 'k-done' : ls === 'awaiting' ? 'k-awaiting' : ls === 'running' ? 'k-running' : ls === 'failed' ? 'k-failed' : '';
    return `<div class="ip-link" title="${esc(step.name)}">
      <span class="arr">${arrow}</span>
      <span class="ln">${String(step.no ?? '').padStart(2, '0')} ${esc(step.name)}</span>
      <span class="ls ${k}">${esc(STEP_LABEL[ls] || ls)}</span>
    </div>`;
  };

  body.innerHTML = `
    <div class="inspector-content">
      <div class="ip-step">STEP ${String(s.no ?? '').padStart(2, '0')}</div>
      <h3 class="ip-name">${esc(s.name)} <span class="st st-${esc(st)}">${esc(label)}</span></h3>
      <div class="ip-time">${s.at ? esc(fmtTime(s.at)) + ' · ' + esc(ago(s.at)) : '时间 —'}</div>

// 选中需求：中央/右侧跟着换，滚动回顶部；步骤选择清空
function selectTask(id, opts = {}) {
  ui.taskId = id;
  ui.stepKey = null;
  if (!opts.keepView) ui.view = 'chain';
  renderAll();
  document.getElementById('center').scrollTop = 0;
  document.getElementById('insp-body').scrollTop = 0;
}

function selectStep(key) {
  ui.stepKey = key;
  withScroll(document.getElementById('center-chain'), renderChain);
  renderInspector();
  // 窄屏（≤1280）Inspector 是覆盖层：点步骤就带出来
  if (window.matchMedia('(max-width: 1280px)').matches) {
    document.body.classList.add('insp-open');
    syncToggleStates();
  }
}

document.addEventListener('click', (ev) => {
  // 设置弹层：点外面关掉
  const pop = document.getElementById('settings-pop');
  if (!pop.hidden && !pop.contains(ev.target) && ev.target !== document.getElementById('tb-settings')
      && !document.getElementById('tb-settings').contains(ev.target)) {
    pop.hidden = true;
    document.getElementById('tb-settings').classList.remove('on');
  }

  const el = ev.target.closest('[data-task],[data-step],button');
  if (!el) return;

  if (el.classList.contains('req-item') && el.dataset.task) {
    if (el.dataset.task !== ui.taskId) selectTask(el.dataset.task);
    else if (ui.view === 'overview') selectTask(el.dataset.task);
    return;
  }
  if (el.classList.contains('ov-row') && el.dataset.task) { selectTask(el.dataset.task); return; }
  if (el.classList.contains('step-card') && el.dataset.step) { selectStep(el.dataset.step); return; }

  switch (el.id) {
    case 'tb-decision': {
      // 定位到第一个待决策步骤：选需求 → 选步骤 → Inspector 直接打开
      const tk = ((lastFlow && lastFlow.tasks) || []).find((t) => (t.steps || []).some(isAwaiting));
      if (!tk) return;
      ui.taskId = tk.id;
      ui.view = 'chain';
      ui.stepKey = (tk.steps.find(isAwaiting) || {}).key || null;
      renderAll();
      document.getElementById('center').scrollTop = 0;
      document.body.classList.add('insp-open');
      syncToggleStates();
      return;
    }
    case 'btn-overview':
      ui.view = ui.view === 'overview' ? 'chain' : 'overview';
      renderCenter();
      return;
    case 'rail-focus':
      document.getElementById('focus-drawer').style.display = 'flex';
      return;
    case 'rail-agents':
      toggleAgentDrawer();
      return;
    // 技能 / 文件：同一个底部抽屉换内容（不要两套交互）
    case 'rail-skills':
      openHub('skills');
      return;
    case 'rail-files':
      openHub('files');
      return;
    case 'ad-close':
      closeAgentDrawer();
      return;
    case 'fd-close':
      // display:none 保留 iframe，不重载
      document.getElementById('focus-drawer').style.display = 'none';
      return;
    case 'tb-search': {
      const input = document.getElementById('tb-search-input');
      input.hidden = !input.hidden;
      el.classList.toggle('on', !input.hidden);
      if (!input.hidden) input.focus();
      else { input.value = ''; ui.search = ''; renderReqList(); }
      return;
    }
    case 'tb-settings':
      pop.hidden = !pop.hidden;
      el.classList.toggle('on', !pop.hidden);
      return;
    case 'sp-refresh':
      tick();
      pop.hidden = true;
      document.getElementById('tb-settings').classList.remove('on');
      return;
    case 'sp-poll-btn': {
      const btn = el, label = document.getElementById('sp-poll');
      if (pollTimer != null) { stopPolling(); label.textContent = '关'; btn.textContent = '恢复'; }
      else { tick(); startPolling(); label.textContent = '开'; btn.textContent = '暂停'; }
      return;
    }
    case 'sp-quiet-btn': {
      // 背景降噪：关掉顶栏/底栏的星空，只留纯色。设置持久化。
      const on = !document.body.classList.contains('quiet');
      applyQuiet(on);
      try { localStorage.setItem('office.quiet', on ? '1' : '0'); } catch { /* 隐私模式 */ }
      return;
    }
    case 'tb-insp-toggle':
      document.body.classList.toggle('insp-open');
      syncToggleStates();
      return;
    case 'tb-reqs-toggle':
      document.body.classList.toggle('reqs-open');
      syncToggleStates();
      return;
  }
});

/* ---- 专注抽屉拖宽：480–1000px，拖动时 iframe 不吃指针 ---- */
(() => {
  const drawer = document.getElementById('focus-drawer');
  const grip = document.getElementById('fd-grip');
  const frame = document.getElementById('fd-frame');
  frame.addEventListener('load', () => { frame.dataset.loaded = '1'; });
  let dragging = false;
  grip.addEventListener('pointerdown', (e) => {
    dragging = true;
    grip.classList.add('dragging');
    grip.setPointerCapture(e.pointerId);
    frame.style.pointerEvents = 'none';
  });
  grip.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const w = Math.min(1000, Math.max(480, window.innerWidth - e.clientX));
    drawer.style.width = w + 'px';
  });
  const stop = (e) => {
    if (!dragging) return;
    dragging = false;
    grip.classList.remove('dragging');
    try { grip.releasePointerCapture(e.pointerId); } catch { /* 已释放 */ }
    frame.style.pointerEvents = '';
  };
  grip.addEventListener('pointerup', stop);
  grip.addEventListener('pointercancel', stop);
})();

   数据全部来自 /api/state，不额外请求，也不缓存过期快照。 */

/** 岗位（看板上一律显示岗位，不显示内部 agent id） */
const ROLE = {

const AVATAR = {
  claude: 'claude-code.png', codex: 'codex.png', 'claude-readonly': 'claude-readonly.png',
  'image-gen': 'image-gen.png', dsh: 'dsh.png', hermes: 'hermes.png', 'gpt-drive': 'gpt-drive.png',

function avatarFile(id) {
  return AVATAR[id] || 'hermes.png';
}

function fmtNum(n) {
  if (n == null || !Number.isFinite(Number(n))) return '—';
  const v = Number(n);
  if (v >= 1e6) return (v / 1e6).toFixed(2) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
  return String(v);
}

function fmtAgo(iso) {
  return ago(iso) || '—';
}

/* ================= 文件预览 ================= */
/* 点 Inspector 里的产物 → 拉 /api/office/file → 按类型渲染。
   Markdown 不做富文本渲染，直接显示原文——要"看真实内容"，不是"看美化后的成品"，
   原文更能暴露问题（比如文件其实是空的、或者写的是别的任务）。 */
async function openFileView(p) {
  const box = document.getElementById('file-view');
  const body = document.getElementById('fv-body');
  document.getElementById('fv-name').textContent = String(p).split(/[\\/]/).pop();
  document.getElementById('fv-meta').textContent = '';
  document.getElementById('fv-path').textContent = p;
  body.innerHTML = '<div class="fv-msg">读取中…</div>';
  box.classList.add('open');

  const ext = (String(p).match(/\.[^.\\/]+$/) || [''])[0].toLowerCase();
  // 图片直接走 img
  if (['.png', '.jpg', '.jpeg', '.webp', '.gif'].includes(ext)) {
    body.innerHTML = `<img src="/api/office/file?path=${encodeURIComponent(p)}" alt="">`;
    return;
  }

  try {
    const res = await fetch(`/api/office/file?path=${encodeURIComponent(p)}`);
    const d = await res.json();
    if (!res.ok || d.exists === false) {
      body.innerHTML = `<div class="fv-warn">${esc(d.error || ('HTTP ' + res.status))}</div>`;
      return;
    }
    document.getElementById('fv-meta').textContent =
      `${fmtBytes(d.bytes)}${d.modifiedAt ? ' · ' + fmtTime(d.modifiedAt) : ''}`;
    if (d.kind === 'binary') {
      body.innerHTML = `<div class="fv-msg">${esc(d.note || '二进制文件，不支持预览')}</div>`;
      return;
    }
    const warn = d.truncated
      ? `<div class="fv-warn">文件 ${fmtBytes(d.bytes)}，超过 2MB 只显示前 2MB</div>` : '';
    body.innerHTML = `${warn}<pre>${esc(d.text || '')}</pre>`;
  } catch (e) {
    body.innerHTML = `<div class="fv-warn">读取失败：${esc(e.message)}</div>`;
  }
}

function closeFileView() {
  document.getElementById('file-view').classList.remove('open');
  document.getElementById('fv-body').innerHTML = '';
}

// Inspector 里点产物行 / 点遮罩关闭
document.addEventListener('click', (e) => {

  if (row) { openFileView(row.getAttribute('data-open-file')); return; }
  if (e.target.id === 'file-view') closeFileView();
});
document.getElementById('fv-close').addEventListener('click', closeFileView);

function applyQuiet(on) {

});

function agentOf(id) {
  return (lastState && lastState.agents || []).find((a) => a.id === id) || null;
}

/** Agent 的忙闲判定：running/claimed/retrying 都算在干活 */
function agentBusy(a) {
  const t = a.totals || {};
  return (t.running || 0) + (t.queued || 0) + (t.retrying || 0) > 0;
}

function dotClass(a) {
  if (!a.online) return 'off';
  return agentBusy(a) ? 'busy' : 'on';
}

function renderAgentList() {
  const list = document.getElementById('ad-list');
  const agents = (lastState && lastState.agents) || [];
  document.getElementById('ad-count').textContent =
    agents.length ? `${agents.filter((a) => a.online).length}/${agents.length} 在线` : '—';

  if (!agents.length) {
    list.innerHTML = '<div class="add-empty">中台还没有上报 Agent</div>';
    return;
  }

  list.innerHTML = agents.map((a) => {
    const t = a.totals || {};
    const bits = [];
    if (t.running) bits.push(`${t.running} 执行中`);
    if (t.queued) bits.push(`${t.queued} 排队`);
    if (!bits.length) bits.push(a.online ? '空闲' : '离线');
    if (t.doneToday) bits.push(`今日完成 ${t.doneToday}`);
    return `<div class="ad-agent${a.id === agentUI.selId ? ' sel' : ''}" data-agent="${esc(a.id)}">
      <img class="ad-ava" src="assets/agents/${esc(avatarFile(a.id))}" alt=""
           onerror="this.style.visibility='hidden'">
      <div class="ad-info">
        <div class="ad-name">${esc(a.name || a.id)}</div>
        <div class="ad-meta">${esc(ROLE[a.id] || '—')} · ${esc(bits.join(' · '))}</div>
      </div>
      <span class="ad-dot ${dotClass(a)}"></span>
    </div>`;
  }).join('');
}

function renderAgentDetail() {
  const box = document.getElementById('add-body');
  const det = document.getElementById('ad-detail');
  if (!agentUI.selId) { det.classList.remove('open'); return; }

  const a = agentOf(agentUI.selId);
  if (!a) { det.classList.remove('open'); return; }

  det.classList.add('open');
  document.getElementById('add-name').textContent = a.name || a.id;
  document.getElementById('add-role').textContent = `${ROLE[a.id] || '—'} · ${a.online ? '在线' : '离线'}`;

  const t = a.totals || {};
  const c = t.usage || {};
  const cost = c.cost != null ? `$${Number(c.cost).toFixed(2)}` : '未统计';
  const tokens = (c.input || c.output)
    ? `${fmtNum((c.input || 0) + (c.output || 0))} tokens`
    : '未统计';

  const runs = (lastState.runs || []).filter((r) => r.agent === a.id).slice(0, 8);
  const runHtml = runs.length ? runs.map((r) => `
    <div class="add-run">
      <div class="ar-top">
        <span class="st st-${esc(r.state === 'done' ? 'done' : r.state === 'failed' ? 'failed' : 'running')}">
          ${esc({ done: '完成', running: '执行中', failed: '失败', claimed: '已领取', retrying: '重试' }[r.state] || r.state)}
        </span>
        <span class="ar-rule">${esc(r.rule || '—')}</span>
      </div>
      ${r.summary ? `<div class="ar-sum" title="${esc(r.summary)}">${esc(r.summary)}</div>` : ''}
    </div>`).join('') : '<div class="add-empty">最近没有执行记录</div>';

  box.innerHTML = `
    <div class="add-sec">
      <h4>当前状态</h4>
      <div class="add-kv"><span>连接</span><span>${a.online ? '在线' : '离线'}</span></div>
      <div class="add-kv"><span>执行中</span><span>${t.running ?? '—'}</span></div>
      <div class="add-kv"><span>排队</span><span>${t.queued ?? '—'}</span></div>
      <div class="add-kv"><span>重试中</span><span>${t.retrying ?? '—'}</span></div>
      <div class="add-kv"><span>最近心跳</span><span>${a.seenAt ? fmtAgo(a.seenAt) : '—'}</span></div>
    </div>
    <div class="add-sec">
      <h4>累计工作量</h4>
      <div class="add-kv"><span>已完成</span><span>${t.done ?? '—'}</span></div>
      <div class="add-kv"><span>今日完成</span><span>${t.doneToday ?? '—'}</span></div>
      <div class="add-kv"><span>Token</span><span>${tokens}</span></div>
      <div class="add-kv"><span>花费</span><span>${cost}</span></div>
    </div>
    <div class="add-sec">
      <h4>最近执行</h4>
      ${runHtml}
    </div>`;
}

 } else {
 let count=0;
 const groups=(lastFlow?.tasks||[]).map(t=>{const files=dedupFiles((t.steps||[]).flatMap(s=>s.files||[]));count+=files.length;return '<details class="filegroup" data-group="'+esc(t.id)+'" '+(opened.has(t.id)||!hub.querySelector('.filegroup')?'open':'')+'><summary>'+esc(t.title)+' · '+files.length+'</summary>'+files.map(f=>'<button class="library-file" data-open-file="'+esc(f.path)+'">'+icon('file')+'<span>'+esc(normPath(f.path).split('/').pop())+'</span><small>'+fmtBytes(f.bytes)+'</small></button>').join('')+(files.length?'':'<p>—</p>')+'</details>'}).join('');
 document.getElementById('ad-count').textContent=count+' 个文件';hub.innerHTML=groups||'—';
 }
 });
}
document.getElementById('hub').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){skillPage+=Number(b.dataset.page);renderHub()}if(b.dataset.skill){skillSelected=b.dataset.skill;renderHub()}});
document.getElementById('hub').addEventListener('input',e=>{if(e.target.id!=='skill-search')return;const pos=e.target.selectionStart;skillQuery=e.target.value;skillPage=0;renderHub();const input=document.getElementById('skill-search');input.focus();input.setSelectionRange(pos,pos)});
for(const [id,name] of Object.entries({'rail-reqs':'board','rail-agents':'agents','rail-skills':'skills','rail-files':'folder','rail-focus':'play','tb-search':'search','tb-settings':'resize','tb-reqs-toggle':'board','tb-insp-toggle':'file'})){const el=document.getElementById(id);el.querySelector('svg')?.remove();el.insertAdjacentHTML('afterbegin',icon(name))}
document.getElementById('rail-reqs').onclick=()=>closeAgentDrawer();
document.getElementById('rail-skills').onclick=()=>openHub('skills');
document.getElementById('rail-files').onclick=()=>openHub('files');
const grip=document.getElementById('agent-grip');let drag=null;
function resizeAgent(h){const max=innerHeight*.6;const height=Math.min(max,Math.max(220,h));document.documentElement.style.setProperty('--agent-h',height+'px');grip.setAttribute('aria-valuemin','220');grip.setAttribute('aria-valuemax',Math.round(max));grip.setAttribute('aria-valuenow',Math.round(height))}
grip.onpointerdown=e=>{drag={y:e.clientY,h:document.getElementById('agent-drawer').offsetHeight};grip.setPointerCapture(e.pointerId)};
grip.onpointermove=e=>{if(drag)resizeAgent(drag.h+drag.y-e.clientY)};grip.onpointerup=grip.onpointercancel=()=>drag=null;
grip.onkeydown=e=>{if(['ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();resizeAgent(document.getElementById('agent-drawer').offsetHeight+(e.key==='ArrowUp'?20:-20))}};
/* ================= 启动 ================= */
/* 启动：读回用户上次的降噪设置，再开始轮询 */
try { applyQuiet(localStorage.getItem('office.quiet') === '1'); } catch { applyQuiet(false); }
tick();
startPolling();
</script>
</body>
