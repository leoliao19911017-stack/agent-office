<header class="top"><div class="brand"><span class="brandmark" data-icon="office"></span>Agent Office <span class="muted small">/ Leo 的公司</span></div><span class="top-date muted small" id="date"></span><div class="top-end row"><span class="small row"><i class="dot"></i>工作台运行正常</span><span class="avatar" style="width:27px;height:27px;font-size:11px">L</span></div></header>
<div class="layout"><nav class="sidebar" aria-label="公司导航"><button class="nav active" data-page="company"><span data-icon="office"></span>我的公司</button><button class="nav" data-page="today"><span data-icon="sun"></span>今日工作<span class="count" id="today-count">1</span></button><div class="nav-title">部门 <span id="dept-count">01</span></div><div id="department-nav"></div><button id="create-dept" class="nav muted"><span data-icon="plus"></span>新建部门</button><div class="sidebar-bottom"><div class="row"><span class="avatar">L</span><div><strong>Leo</strong><div class="small muted">创始人 / CEO</div></div></div><p class="small muted" style="margin-top:16px">一个人，也是一家公司。</p></div></nav>

function activeDepartments(){return page==='company'||page==='today'?state.departments:state.departments.filter(d=>d.id===page)}
function render(){renderNav();renderMain();renderRight();hydrate();$('#system-state').textContent=`${state.agents.length} 位员工 · ${state.projects.filter(p=>p.status==='running').length} 项工作执行中`;}
function renderNav(){$('[data-page="company"]').classList.toggle('active',page==='company');$('[data-page="today"]').classList.toggle('active',page==='today');$('#today-count').textContent=state.projects.filter(p=>p.status!=='done').length;$('#dept-count').textContent=String(state.departments.length).padStart(2,'0');$('#department-nav').innerHTML=state.departments.map(d=>`<button class="nav ${page===d.id?'active':''}" data-dept="${d.id}" aria-expanded="${expanded.has(d.id)}">${icon('code')}${esc(d.name)}<span class="count">${expanded.has(d.id)?'⌄':'›'}</span></button>${expanded.has(d.id)?`<div class="members">${d.agents.map(id=>{const a=state.agents.find(x=>x.id===id);return `<button class="nav member" data-agent="${a.id}">${avatar(a)}${esc(a.name)}${agentWork(a.id)?'<i class="dot" style="margin-left:auto"></i>':''}</button>`}).join('')}<button class="nav member muted" data-dept-projects="${d.id}">${icon('list')}项目<span class="count">${state.projects.filter(p=>p.dept===d.id).length}</span></button></div>`:''}`).join('');const value=$('#request-dept').value;$('#request-dept').innerHTML=state.departments.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('');if(state.departments.some(d=>d.id===value))$('#request-dept').value=value}
function projectRows(projects){return projects.length?projects.map(p=>{const a=state.agents.find(a=>a.id===p.agent);return `<button class="project" data-project="${p.id}"><span class="project-icon">${icon(p.status==='done'?'check':'file')}</span><div class="project-info"><strong>${esc(p.name)}</strong><p>${p.status==='done'?'已交付':`第 ${p.step} 步 · ${steps[p.step-1]}`} <span style="padding:0 5px">/</span> ${esc(a?.name||'等待分配')}</p></div><div>${p.status==='done'?`<span class="pill">已完成 · ${esc(p.score)} 分</span>`:`<span class="small muted">${p.status==='queued'?'待调度':`${Math.round((p.step-1)/9*100)}% · 进行中`}</span><div class="progress"><i style="width:${(p.step-1)/9*100}%"></i></div>`}</div>${icon('chevron')}</button>`}).join(''):'<div class="empty">还没有项目，从右侧发起第一个需求。</div>'}
function room(d){const ps=state.projects.filter(p=>p.dept===d.id),current=ps.find(p=>p.status==='running')||ps.find(p=>p.status==='queued'),done=ps.find(p=>p.status==='done');return `<section class="department-room"><div class="room"><div class="room-head row between"><div class="row"><span data-icon="code" class="muted"></span><h3>${esc(d.name)}</h3><span class="small muted">${d.agents.length} 个工位</span></div><button class="plain small" data-config="${d.id}" aria-label="配置${esc(d.name)}">${icon('settings')}配置</button></div><div class="room-body"><div class="wall">${current?`<button class="whiteboard" data-project="${current.id}"><span class="small muted">项目白板</span><div style="font-size:12px;font-weight:600;margin-top:3px">${esc(current.name)}</div><div class="small muted">${current.step} / 9 · ${steps[current.step-1]}</div><div class="board-line"><i style="width:${(current.step-1)/9*100}%"></i></div></button>`:'<div class="whiteboard"><span class="muted">项目白板</span><p class="small" style="margin-top:10px">等待一个新想法</p></div>'}<div><span class="small muted">成果展示墙</span>${done?`<button class="achievement" data-project="${done.id}"><div class="frame"><div>${esc(done.name)}</div><strong>${esc(done.score)}</strong> <span class="small">/ 10 · 已交付</span></div></button>`:'<div class="frame muted">下一份成果<br>将在这里展出</div>'}</div><div class="window" aria-hidden="true"></div></div><div class="desks">${d.agents.map(id=>{const a=state.agents.find(a=>a.id===id),work=agentWork(id);return `<div class="station ${work?'working':''}"><button class="station-button" data-agent="${id}" aria-label="查看 ${esc(a.name)} 员工档案"><div class="desk-scene"><div class="desk-top"></div><div class="monitor">${work?'<div class="code-lines"></div>':''}</div><div class="chair"></div>${avatar(a)}</div><span class="station-name">${esc(a.name)}</span><span class="station-role">${esc(a.role)}</span><span class="station-status">${work?'● 正在执行':id==='dsh'?'备用待命':'待命'}</span></button>${id==='codex'&&done?`<button class="artifact" data-project="${done.id}" aria-label="查看已交付成果">${icon('file')}</button>`:''}</div>`}).join('')||'<div class="muted">尚未配置员工</div>'}</div><div class="room-foot"><span class="row">${icon('leaf')}让好想法，在这里发生。</span>${d.id==='dev'&&state.decision==='pending'?'<button class="pill amber plain" data-decision><i class="dot"></i>1 项待审批 · 演示</button>':'<span class="small">团队空间</span>'}</div></div></div></section>`}
function renderMain(){const ds=activeDepartments(),isDept=!['company','today'].includes(page);const projects=state.projects.filter(p=>ds.some(d=>d.id===p.dept)&&(page!=='today'||p.status!=='done'));$('#main').innerHTML=`<div class="intro row between"><div><h1>${page==='company'?'公司正在生长。':page==='today'?'今天，专注推进。':esc(ds[0].name)}</h1><p class="muted">${page==='company'?`你好，Leo。${state.departments.length} 个部门，${state.agents.length} 位 AI 员工，与你一起把想法落地。`:page==='today'?'从你安排的需求开始，看看团队正在做什么。':esc(ds[0].responsibility)}</p></div><span class="pill"><i class="dot"></i>${projects.filter(p=>p.status==='running').length} 项进行中</span></div><div class="toolbar row between"><div class="tabs" role="tablist" aria-label="工作台视图"><button role="tab" aria-selected="${view==='office'}" class="${view==='office'?'selected':''}" data-view="office">${icon('grid')}办公室</button><button role="tab" aria-selected="${view==='work'}" class="${view==='work'?'selected':''}" data-view="work">${icon('list')}工作</button></div>${isDept?`<button class="plain muted" data-config="${ds[0].id}">${icon('settings')}部门配置</button>`:'<span class="small muted">公司的每一步，都看得见</span>'}</div>${view==='office'?ds.map(room).join('')+`<div class="room-bottom row between"><div class="legend"><span class="row"><i class="dot"></i>执行中 · 屏幕亮起</span><span class="row"><i class="dot" style="background:#b7832e"></i>待审批</span><span class="row">${icon('file')}交付物</span></div><span>点击工位，了解员工</span></div><div class="projects-heading row between"><h3>${page==='today'?'今日待推进':'部门项目'}</h3><span class="small muted">${projects.length} 个项目</span></div><div class="card work-list">${projectRows(projects)}</div>`:ds.map(d=>`<section class="card work-list" style="margin-bottom:18px"><div class="work-label row between"><span>${esc(d.name)} / ${esc(d.workflow)}</span><span>项目 · 阶段 · 负责人</span></div>${projectRows(projects.filter(p=>p.dept===d.id))}</section>`).join('')}<div class="overview-note row between"><span>${isDept?esc(ds[0].workflow):'从研发部开始，让公司随着你的想法成长。'}</span><button class="plain small" data-new>${icon('plus')}创建部门</button></div>`;hydrate()}
function renderRight(){$('#decision-count').textContent=state.decision==='pending'?'1':'0';$('#decision-area').innerHTML=state.decision==='pending'?`<button class="decision" data-decision><div class="row between"><strong>界面重构 · 方向确认</strong><span class="pill amber">待审批</span></div><p>确认办公室视图作为公司首页的默认视图。</p><div class="row between small"><span>交互演示 · 非真实审批</span><span>查看决策 →</span></div></button>`:'<div class="detail-box small muted">没有待决策事项。团队的进展会在这里更新。</div>';$('#activity').innerHTML=state.activities.map(a=>`<div class="event"><time>${esc(a.time)}</time><div>${esc(a.title)}</div><p>${esc(a.detail)}</p></div>`).join('')}
function openModal(title,body,foot=''){if(!$('#modal').open)lastFocus=document.activeElement;$('#modal').innerHTML=`<div class="modal-head row between"><h2 id="modal-title">${esc(title)}</h2><button class="plain" data-close aria-label="关闭弹窗">${icon('close')}</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}`;if(!$('#modal').open)$('#modal').showModal()}
function closeModal(){$('#modal').close();lastFocus?.isConnected&&lastFocus.focus()}
function profile(id,editing=false){const a=state.agents.find(a=>a.id===id),work=agentWork(id);openModal('员工档案',`<div class="profile-hero">${avatar(a)}<div><h2>${esc(a.name)}</h2><div class="muted">${esc(a.role)} · ${state.departments.filter(d=>d.agents.includes(id)).map(d=>esc(d.name)).join('、')||'尚未分配部门'}</div></div></div>${editing?`<form id="agent-form" data-id="${id}"><label class="field">岗位<input name="role" value="${esc(a.role)}" required maxlength="30"></label><label class="field">职责<textarea name="responsibility" required maxlength="300">${esc(a.responsibility)}</textarea></label></form>`:`<h3>岗位职责</h3><p class="muted" style="margin-top:7px">${esc(a.responsibility)}</p><div class="detail-box"><h3>当前在干什么</h3><p>${work?`${esc(work.name)} · 第 ${work.step} 步 ${steps[work.step-1]}`:'当前没有执行中的任务，等待调度。'}</p></div>${work?`<button data-project="${work.id}">${icon('file')}查看当前项目</button>`:''}`}`,editing?'<button data-close>取消</button><button class="primary" type="submit" form="agent-form">保存员工配置</button>':`<button class="primary" data-edit-agent="${id}">${icon('settings')}配置员工</button>`)}
function project(id){const p=state.projects.find(p=>p.id===id),d=state.departments.find(d=>d.id===p.dept),a=state.agents.find(a=>a.id===p.agent);openModal(p.name,`<div class="row between"><span class="muted">${esc(d.name)} · ${esc(d.workflow)}</span><span class="pill">${p.status==='done'?`已完成 · ${p.score} 分`:p.status==='queued'?'等待调度':'执行中'}</span></div><p style="margin-top:16px">${esc(p.description)}</p><div class="detail-box"><span class="muted">当前负责人</span> <strong>${esc(a?.name||'待分配')}</strong><br>${p.status==='done'?'交付已完成，九步流程已归档。':p.status==='queued'?'需求已收到，尚未开始执行。':`正在推进：第 ${p.step} 步 · ${steps[p.step-1]}`}</div><ol class="steps">${steps.map((s,i)=>`<li class="${p.status==='done'||i<p.step-1?'done':i===p.step-1?'current':''}"><span class="step-number">${p.status==='done'||i<p.step-1?'✓':i+1}</span>${s}<span class="state">${p.status==='done'||i<p.step-1?'已完成':i===p.step-1?p.status==='queued'?'待开始':'进行中':'未开始'}</span></li>`).join('')}</ol>`, '<button class="primary" data-close>返回工作台</button>')}
function decision(){openModal('界面重构 · 方向确认','<span class="pill amber">交互演示 · 非真实审批</span><div class="detail-box"><h3>默认进入办公室视图</h3><p>用工位呈现员工状态，用白板追踪项目进展；需要集中查看进度时，切换到工作视图。</p></div><p class="muted">这条演示审批用于体验 CEO 决策流程。确认后会清除琥珀色提示并记录动态，不会改变项目的真实执行步骤。</p><label class="field" style="margin-top:18px">决策备注（退回时必填）<textarea id="decision-note" maxlength="300" placeholder="补充你的建议…"></textarea></label><div class="error" id="decision-error" role="alert"></div>','<button data-resolve="returned">退回调整</button><button class="primary" data-resolve="approved">确认方向</button>')}
function startWizard(id){const d=state.departments.find(d=>d.id===id);wizard={step:1,id:d?.id,name:d?.name||'',responsibility:d?.responsibility||'',agents:d?[...d.agents]:[],workflow:d?.workflow||'产品研发 · 九步交付'};renderWizard()}
function renderWizard(){const w=wizard;openModal(w.id?'配置部门':'创建一个新部门',`<div class="wizard-steps">${['部门职责','配置员工','工作流'].map((x,i)=>`<span class="${w.step===i+1?'current':''}">${i+1}. ${x}</span>`).join('')}</div><form id="wizard-form">${w.step===1?`<label class="field">部门名称<input name="name" placeholder="例如：营销部" value="${esc(w.name)}" maxlength="20" required></label><label class="field">部门职责<textarea name="responsibility" placeholder="这个部门负责什么？" maxlength="300" required>${esc(w.responsibility)}</textarea></label>`:w.step===2?`<p class="muted" style="margin-bottom:16px">选择部门成员。员工可协作于多个部门。</p>${state.agents.map(a=>`<label class="agent-option"><input type="checkbox" name="agents" value="${a.id}" ${w.agents.includes(a.id)?'checked':''}>${avatar(a)}<span>${esc(a.name)}<span class="muted small"> / ${esc(a.role)}</span></span></label>`).join('')}`:`<label class="field">部门工作流<select name="workflow"><option>产品研发 · 九步交付</option><option>通用项目 · 九步交付</option></select></label><p class="muted">${steps.join(' → ')}</p><div class="detail-box"><strong>${esc(w.name)}</strong><p>${esc(w.responsibility)}</p><span class="small muted">${w.agents.map(id=>esc(state.agents.find(a=>a.id===id).name)).join('、')}</span></div>`}<div class="error" id="wizard-error" role="alert"></div></form>`,`${w.step>1?'<button data-wizard-back>上一步</button>':'<button data-close>取消</button>'}<button type="submit" form="wizard-form" class="primary">${w.step===3?w.id?'保存配置':'创建部门':'下一步'}</button>`);if(w.step===3)$('#wizard-form select').value=w.workflow}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-close'))return closeModal();if(b.dataset.page){page=b.dataset.page;if(page==='today')view='work';return render()}if(b.dataset.dept){const id=b.dataset.dept;if(page===id){expanded.has(id)?expanded.delete(id):expanded.add(id)}else{page=id;expanded.add(id)}return render()}if(b.dataset.deptProjects){page=b.dataset.deptProjects;view='work';return render()}if(b.dataset.view){view=b.dataset.view;return renderMain()}if(b.dataset.agent)return profile(b.dataset.agent);if(b.dataset.editAgent)return profile(b.dataset.editAgent,true);if(b.dataset.project)return project(b.dataset.project);if(b.hasAttribute('data-decision'))return decision();if(b.id==='create-dept'||b.hasAttribute('data-new'))return startWizard();if(b.dataset.config)return startWizard(b.dataset.config);if(b.hasAttribute('data-wizard-back')){if(wizard.step===2)wizard.agents=[...$('#wizard-form').querySelectorAll(':checked')].map(x=>x.value);if(wizard.step===3)wizard.workflow=$('#wizard-form select').value;wizard.step--;return renderWizard()}if(b.dataset.resolve){const note=$('#decision-note').value.trim();if(b.dataset.resolve==='returned'&&!note){$('#decision-error').textContent='请填写调整意见，让团队知道如何修改。';return}state.decision=b.dataset.resolve;activity(b.dataset.resolve==='approved'?'Leo 确认了界面方向':'Leo 退回了方向确认',note||'办公室视图作为默认入口 · 演示决策');save();closeModal();render();toast('决策已记录')}});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target,f=new FormData(form);if(form.id==='request-form'){const name=$('#request-input').value.trim();if(!name)return toast('请先写下你的需求');const dept=$('#request-dept').value,id='p'+Date.now();state.projects.unshift({id,name,description:name,dept,step:1,agent:null,status:'queued'});activity('Leo 发起了新需求',name);page=dept;view='work';expanded.add(dept);$('#request-input').value='';save();render();toast('需求已加入部门项目，等待调度')}if(form.id==='agent-form'){const role=f.get('role').trim(),responsibility=f.get('responsibility').trim();if(!role||!responsibility)return toast('岗位与职责不能为空');Object.assign(state.agents.find(a=>a.id===form.dataset.id),{role,responsibility});save();render();profile(form.dataset.id);toast('员工配置已保存')}if(form.id==='wizard-form'){const w=wizard;if(w.step===1){w.name=f.get('name').trim();w.responsibility=f.get('responsibility').trim();if(!w.name||!w.responsibility){$('#wizard-error').textContent='请填写部门名称和职责。';return}if(state.departments.some(d=>d.name===w.name&&d.id!==w.id)){$('#wizard-error').textContent='已存在同名部门，请换一个名称。';return}}if(w.step===2){w.agents=f.getAll('agents');if(!w.agents.length){$('#wizard-error').textContent='请至少选择一位员工。';return}}if(w.step<3){w.step++;renderWizard()}else{w.workflow=f.get('workflow');const id=w.id||'d'+Date.now(),department={id,name:w.name,responsibility:w.responsibility,agents:w.agents,workflow:w.workflow};if(w.id)Object.assign(state.departments.find(d=>d.id===id),department);else state.departments.push(department);activity(w.id?'部门配置已更新':'新部门成立',w.name);page=id;expanded.add(id);view='office';save();closeModal();render();toast(w.id?'部门配置已保存':'新部门已创建')}}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
$('#date').textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());render();
</script>
</body></html>
