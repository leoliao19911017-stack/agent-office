<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Office</title>
<style>
:root{--background:#ffffff;--foreground:#262626;--muted:#f5f5f5;--muted-foreground:#737373;--border:#e5e5e5;--accent:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--foreground);font:14px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit;color:inherit}button{height:32px;border:1px solid var(--border);border-radius:8px;padding:0 12px;background:white;font-size:14px;font-weight:500;cursor:pointer}button:hover{background:var(--muted)}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.primary{background:var(--accent);border-color:var(--accent);color:white}.primary:hover{background:#1d4ed8}h1,h2,h3,p{margin:0}h1{font-size:20px;font-weight:600}h2{font-size:16px;font-weight:600}h3{font-size:14px;font-weight:600}.muted{color:var(--muted-foreground)}.small{font-size:12px}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.blue{color:var(--accent)}.dot{display:inline-block;width:6px;height:6px;background:currentColor;border-radius:50%;margin-right:6px}svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}.top{height:48px;border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:600}.top .row{gap:20px}.layout{display:grid;grid-template-columns:208px minmax(0,1fr) 320px;height:calc(100dvh - 76px)}.sidebar{border-right:1px solid var(--border);padding:20px 12px;overflow:auto}.nav{border:0;display:flex;align-items:center;gap:8px;text-align:left;width:100%;margin-bottom:4px;background:transparent}.nav.active{background:var(--muted);color:var(--accent)}.label{padding:24px 12px 8px;font-size:12px;color:var(--muted-foreground)}.tree{margin:8px 0 16px 20px;border-left:1px solid var(--border);padding-left:8px}.tree .nav{font-size:12px;padding:0 8px}.tree .label{padding:8px;font-size:11px}.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dept-name{flex:1}.toggle{width:24px;padding:0;border:0;flex:none}.dept-row{display:flex;align-items:center}.dept-row>.nav{margin:0;padding-left:4px}.main{min-width:0;overflow:auto}.tabs{height:56px;border-bottom:1px solid var(--border);display:flex;gap:24px;padding:0 28px;align-items:stretch}.tab{height:auto;border:0;border-radius:0;padding:0 2px;background:transparent;color:var(--muted-foreground);border-bottom:2px solid transparent}.tab[aria-selected=true]{color:var(--foreground);border-bottom-color:var(--accent)}.content{padding:28px}.page-head{margin-bottom:24px}.page-head p{margin-top:4px}.card{border:1px solid var(--border);border-radius:12px;overflow:hidden}.dept-head{padding:18px 20px;border-bottom:1px solid var(--border)}.employees{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:20px}.employee{height:auto;min-height:128px;padding:16px 12px;text-align:left;border-radius:12px;display:flex;flex-direction:column;align-items:flex-start;font-weight:400}.employee strong{font-weight:600;white-space:nowrap}.employee .status{margin-top:20px;font-size:12px}.projects{border-top:1px solid var(--border);padding:18px 20px 8px}.project-line{width:100%;height:auto;min-height:52px;border:0;border-radius:0;display:grid;grid-template-columns:minmax(0,1fr) 168px 92px;align-items:center;gap:12px;text-align:left;padding:10px 0;font-weight:400;border-bottom:1px solid var(--border)}.project-line:last-child{border-bottom:0}.project-line span:not(:first-child){font-size:12px;color:var(--muted-foreground)}.desk{border-left:1px solid var(--border);padding:24px;overflow:auto}.desk>h2{margin-bottom:28px}.desk section+section{border-top:1px solid var(--border);padding-top:24px;margin-top:24px}.desk label{display:block;font-weight:600;margin-bottom:12px}input,textarea{display:block;width:100%;min-height:40px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:white}textarea{resize:vertical}.desk textarea{height:112px;margin-bottom:12px}.desk .primary{width:100%}.decision{margin-top:14px;padding:14px}.decision .row{margin-top:12px}.activity{padding-top:16px}.activity p+p{margin-top:4px}.footer{height:28px;border-top:1px solid var(--border);padding:0 16px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted-foreground)}.table-header,.work-summary{display:grid;grid-template-columns:minmax(0,1fr) 154px 90px 54px 60px;gap:12px;align-items:center;padding:14px 16px}.table-header{background:var(--muted);font-size:12px;color:var(--muted-foreground)}.work-item+ .work-item{border-top:1px solid var(--border)}summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}.work-summary:hover{background:var(--muted)}.work-summary>span:not(:first-child){font-size:12px}.work-summary>span:first-child{display:flex;align-items:center;gap:6px}.work-item[open] .chevron{transform:rotate(90deg)}.steps{list-style:none;margin:0;padding:16px 20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;border-top:1px solid var(--border)}.steps li{border:1px solid var(--border);border-radius:8px;padding:12px;font-size:12px}.steps li.current{border-color:var(--accent)}.steps li p{margin-top:5px;color:var(--muted-foreground)}.steps li.current p{color:var(--accent)}.empty{padding:24px 20px;color:var(--muted-foreground);font-size:12px}.department-block+.department-block{margin-top:20px}dialog{width:540px;max-width:calc(100vw - 40px);max-height:85dvh;padding:0;border:1px solid var(--border);border-radius:12px;color:var(--foreground);background:white}dialog::backdrop{background:rgb(38 38 38 / 20%)}.modal-head{padding:20px 24px;border-bottom:1px solid var(--border)}.modal-body{padding:24px}.modal-body>p{margin-bottom:20px}.modal-body label{display:block;margin-bottom:16px}.modal-body label input,.modal-body label textarea{margin-top:8px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}dl{display:grid;grid-template-columns:80px 1fr;gap:18px;margin:0}dt{color:var(--muted-foreground)}dd{margin:0}.checks{display:grid;grid-template-columns:1fr 1fr;gap:12px}.checks label{display:flex;align-items:center;gap:8px;margin:0}.checks input{width:16px;min-height:16px;accent-color:var(--accent);margin:0}.error{font-size:12px;margin-top:12px}.notice{margin-top:12px;font-size:12px;color:var(--muted-foreground)}fieldset{margin:0;padding:14px;border:1px solid var(--border);border-radius:8px}legend{padding:0 4px}.close{width:32px;padding:0;display:grid;place-items:center}
@media(max-width:1100px){.layout{grid-template-columns:184px minmax(0,1fr) 280px}.content{padding:20px}.employees{grid-template-columns:repeat(2,minmax(0,1fr))}.project-line{grid-template-columns:1fr}.table-header,.work-summary{grid-template-columns:minmax(140px,1fr) 130px 80px 45px 50px}.work-table{overflow:auto}.work-item,.table-header{min-width:560px}}
@media(max-width:760px){.layout{height:auto;min-height:calc(100dvh - 76px);grid-template-columns:160px minmax(0,1fr)}.desk{grid-column:1/-1;border-left:0;border-top:1px solid var(--border)}.employees{grid-template-columns:1fr}.top{padding:0 12px}.top .row{gap:8px}.steps{grid-template-columns:1fr}.content{padding:16px}.footer{height:auto;min-height:28px;gap:12px}}
</style>
</head>
<body>
<header class="top"><span class="brand">Agent Office</span><div class="row small muted"><time id="date"></time><span><span class="dot"></span>运行中</span></div></header>
<div class="layout">
<nav class="sidebar" aria-label="公司导航" id="sidebar"></nav>
<main class="main"><div class="tabs" role="tablist" aria-label="视图"><button class="tab" role="tab" id="office-tab" aria-controls="content" data-tab="office" aria-selected="true">办公室</button><button class="tab" role="tab" id="work-tab" aria-controls="content" data-tab="work" aria-selected="false" tabindex="-1">工作</button></div><div class="content" id="content" role="tabpanel" aria-labelledby="office-tab"></div></main>
<aside class="desk" aria-label="CEO 办公桌"><h2>CEO 办公桌</h2><section><form id="request-form"><label for="request">发起需求</label><textarea id="request" placeholder="描述你想完成的工作…" required maxlength="500"></textarea><button class="primary" type="submit">发起需求</button><p class="notice" id="request-target"></p></form></section><section><div class="row between"><h3>待我决策</h3><span class="small muted" id="decision-count">1</span></div><div id="decision-card" class="card decision"><p>界面重构 · 方向确认</p><div class="row between"><span class="small muted">待审批</span><button data-action="decision">查看</button></div></div></section><section><h3>近期动态</h3><div id="activities"><div class="activity"><p>Claude Code 正在开发与自测</p><p class="small muted">12:30</p></div><div class="activity"><p>任务归档与删除已交付</p><p class="small muted">8.3 分</p></div></div></section></aside>
</div>
<footer class="footer"><span id="status" role="status">就绪</span><span>本地原型 · 修改仅保留在当前页面</span></footer>
<dialog id="modal" aria-labelledby="modal-title"><div class="modal-head row between"><h2 id="modal-title"></h2><button class="close" aria-label="关闭" data-action="close"><svg viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8"/></svg></button></div><div class="modal-body" id="modal-body"></div></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svg=path=>`<svg viewBox="0 0 16 16" aria-hidden="true"><path d="${path}"/></svg>`;
const chevron=()=>`<svg class="chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 4 4 4-4 4"/></svg>`;
const agents=[{id:'hermes',name:'Hermes',role:'调度',duty:'安排任务、协调项目交接。'},{id:'claude',name:'Claude Code',role:'开发',duty:'实现功能并完成开发与自测。'},{id:'codex',name:'Codex',role:'评审',duty:'评审代码与交付质量。'},{id:'dsh',name:'DSH',role:'备用开发',duty:'按需承接开发任务。'}];
const departments=[{id:'dev',name:'研发部',agents:agents.map(a=>a.id)}];
const projects=[{id:'office',name:'Agent Office 界面重构',dept:'dev',step:5,agent:'claude',status:'running'},{id:'archive',name:'任务归档与删除',dept:'dev',step:9,agent:null,status:'done',score:'8.3'}];
const steps=['需求接收','需求澄清','方案设计','任务拆解','开发与自测','代码评审','集成测试','CEO 验收','交付归档'];
let selected='dev',view='office',expanded=new Set(['dev']),decision='pending';
const agentName=id=>agents.find(a=>a.id===id)?.name||'未提供';
const scope=()=>selected==='company'||selected==='today'?departments:departments.filter(d=>d.id===selected);
const currentProjects=()=>projects.filter(p=>scope().some(d=>d.id===p.dept));
const stateText=p=>p.status==='done'?'已完成':p.status==='queued'?'待调度':'执行中';
const stepText=p=>p.status==='done'?'已完成':`第 ${p.step} 步 ${steps[p.step-1]}`;
function renderSidebar(){
 $('#sidebar').innerHTML=`<button class="nav ${selected==='company'?'active':''}" data-page="company">${svg('M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9h5v5H9z')}我的公司</button><button class="nav ${selected==='today'?'active':''}" data-page="today">${svg('M3 3h10v11H3zM5 1v4m6-4v4M3 7h10')}今日工作</button><div class="label">部门</div>${departments.map(d=>`<div class="dept-row"><button class="toggle" data-toggle="${d.id}" aria-label="${expanded.has(d.id)?'收起':'展开'}${esc(d.name)}" aria-expanded="${expanded.has(d.id)}">${svg(expanded.has(d.id)?'m4 6 4 4 4-4':'m6 4 4 4-4 4')}</button><button class="nav ${selected===d.id?'active':''}" data-dept="${d.id}"><span class="truncate dept-name">${esc(d.name)}</span><span class="small muted">${d.agents.length}</span></button></div>${expanded.has(d.id)?`<div class="tree"><div class="label">员工 · ${d.agents.length}</div>${d.agents.map(id=>`<button class="nav" data-agent="${id}">${esc(agentName(id))}</button>`).join('')}<div class="label">项目 · ${projects.filter(p=>p.dept===d.id).length}</div>${projects.filter(p=>p.dept===d.id).map(p=>`<button class="nav" data-project="${p.id}" title="${esc(p.name)}"><span class="truncate">${esc(p.name)}</span></button>`).join('')}</div>`:''}`).join('')}<button class="nav muted" data-action="new-dept">${svg('M8 3v10M3 8h10')}新建部门</button>`;
}
function progress(p){return `<ol class="steps" aria-label="九步进度">${steps.map((s,i)=>{const done=p.status==='done'||i+1<p.step;const active=p.status!=='done'&&i+1===p.step;return `<li class="${active?'current':''}" ${active?'aria-current="step"':''}><span>${i+1}. ${s}</span><p>${done?'已完成':active?(p.status==='queued'?'待调度':'进行中'):'未开始'}</p></li>`}).join('')}</ol>`}
function renderMain(){
 document.querySelectorAll('[data-tab]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.tab===view));b.tabIndex=b.dataset.tab===view?0:-1});$('#content').setAttribute('aria-labelledby',view+'-tab');
 const title=selected==='company'?'我的公司':selected==='today'?'今日工作':scope()[0].name;
 let html=`<div class="page-head row between"><div><h1>${esc(title)}</h1><p class="small muted">${view==='office'?'员工与项目':'项目与九步进度'}</p></div><span class="small muted">${currentProjects().length} 个项目</span></div>`;
 if(view==='office')html+=scope().map(d=>`<section class="card department-block"><div class="dept-head row between"><h2>${esc(d.name)}</h2><span class="small muted">${d.agents.length} 位员工</span></div><div class="employees">${d.agents.map(id=>{const a=agents.find(a=>a.id===id);const busy=projects.some(p=>p.agent===id&&p.status==='running');return `<button class="employee" data-agent="${id}"><strong>${a.name}</strong><span class="small muted">${a.role}</span><span class="status ${busy?'blue':'muted'}">${busy?'<span class="dot"></span>执行中':'待命'}</span></button>`}).join('')}</div><div class="projects"><h3>项目</h3>${projects.filter(p=>p.dept===d.id).map(p=>`<button class="project-line" data-project="${p.id}"><span>${esc(p.name)}</span><span>${stepText(p)}</span><span>${p.score?p.score+' 分':p.agent?agentName(p.agent):'待分配'}</span></button>`).join('')||'<p class="empty">暂无项目，可从右侧发起需求。</p>'}</div></section>`).join('');
 else html+=`<div class="card work-table"><div class="table-header"><span>名称</span><span>当前步骤</span><span>负责人</span><span>进度</span><span>状态</span></div>${currentProjects().map(p=>`<details class="work-item"><summary class="work-summary"><span>${chevron()}${esc(p.name)}</span><span>${stepText(p)}</span><span>${p.agent?agentName(p.agent):p.status==='queued'?'待分配':'未提供'}</span><span>${p.status==='done'?9:p.step-1}/9</span><span class="${p.status==='running'?'blue':'muted'}">${stateText(p)}</span></summary>${progress(p)}</details>`).join('')||'<p class="empty">暂无项目，可从右侧发起需求。</p>'}</div><p class="notice">点击项目展开九步详情；进度按已完成步骤计。</p>`;
 $('#content').innerHTML=html;$('#request-target').textContent=`提交至 ${scope().length===1?scope()[0].name:'研发部'}`;
}
function render(){renderSidebar();renderMain()}
function modal(title,body){$('#modal-title').textContent=title;$('#modal-body').innerHTML=body;$('#modal').showModal()}
function profile(id){const a=agents.find(a=>a.id===id);const work=projects.find(p=>p.agent===id&&p.status==='running');modal(a.name,`<dl><dt>岗位</dt><dd>${a.role}</dd><dt>职责</dt><dd>${a.duty}</dd><dt>当前工作</dt><dd>${work?esc(work.name)+'<br><span class="small muted">'+stepText(work)+'</span>':'待命'}</dd></dl><div class="modal-actions"><button data-action="close">关闭</button></div>`)}
function project(id){const p=projects.find(p=>p.id===id);modal(p.name,`<p class="small muted">${stepText(p)} · ${p.score?p.score+' 分':p.agent?agentName(p.agent):'待分配'}</p>${progress(p)}<div class="modal-actions"><button data-action="close">关闭</button></div>`)}
function newDepartment(){modal('新建部门',`<form id="department-form"><label>名称<input name="name" required maxlength="30" placeholder="输入部门名称"></label><label>职责<textarea name="duty" required maxlength="200" placeholder="描述部门负责的工作"></textarea></label><fieldset><legend>选择 Agent</legend><div class="checks">${agents.map(a=>`<label><input type="checkbox" name="agent" value="${a.id}">${a.name}</label>`).join('')}</div></fieldset><p id="dept-error" class="error" role="alert"></p><div class="modal-actions"><button type="button" data-action="close">取消</button><button type="submit" class="primary">创建部门</button></div></form>`)}
function showDecision(){modal('界面重构 · 方向确认',`<p class="small muted">待审批 · Agent Office 界面重构</p><p>确认采用朴素的三栏布局：左侧部门与员工，中间办公室 / 工作，右侧 CEO 办公桌。</p><label>意见（退回时必填）<textarea id="decision-note" maxlength="500" placeholder="填写需要调整的内容"></textarea></label><p id="decision-error" class="error" role="alert"></p><div class="modal-actions"><button data-resolve="returned">退回修改</button><button class="primary" data-resolve="approved">确认方向</button></div>`)}
function activity(text){const div=document.createElement('div');div.className='activity';div.innerHTML=`<p>${esc(text)}</p><p class="small muted">刚刚</p>`;$('#activities').prepend(div)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action==='close')return $('#modal').close();if(b.dataset.action==='new-dept')return newDepartment();if(b.dataset.action==='decision')return showDecision();if(b.dataset.agent)return profile(b.dataset.agent);if(b.dataset.project)return project(b.dataset.project);if(b.dataset.toggle){expanded.has(b.dataset.toggle)?expanded.delete(b.dataset.toggle):expanded.add(b.dataset.toggle);return renderSidebar()}if(b.dataset.dept){selected=b.dataset.dept;expanded.add(selected);return render()}if(b.dataset.page){selected=b.dataset.page;if(selected==='today')view='work';return render()}if(b.dataset.tab){view=b.dataset.tab;return renderMain()}if(b.dataset.resolve){const note=$('#decision-note').value.trim();if(b.dataset.resolve==='returned'&&!note){$('#decision-error').textContent='请填写需要调整的内容。';$('#decision-note').focus();return}decision=b.dataset.resolve;$('#decision-count').textContent='0';$('#decision-card').innerHTML=`<p>界面重构 · 方向确认</p><p class="small muted" style="margin-top:8px">${decision==='approved'?'已确认':'已退回修改'}</p>${note?`<p class="small" style="margin-top:8px">${esc(note)}</p>`:''}`;activity(decision==='approved'?'已确认界面重构方向':'界面重构方向已退回修改');$('#modal').close();$('#status').textContent='决策已记录（本地）'}});
document.addEventListener('submit',e=>{if(e.target.id==='request-form'){e.preventDefault();const input=$('#request');const name=input.value.trim();if(!name){input.setCustomValidity('请输入需求内容。');input.reportValidity();return}const dept=scope().length===1?scope()[0].id:'dev';projects.push({id:'p'+Date.now(),name,dept,step:1,agent:null,status:'queued'});input.value='';selected=dept;expanded.add(dept);render();activity('已提交需求：'+name);$('#status').textContent='需求已加入项目列表 · 待调度（本地）'}if(e.target.id==='department-form'){e.preventDefault();const data=new FormData(e.target),name=String(data.get('name')).trim(),duty=String(data.get('duty')).trim(),ids=data.getAll('agent');if(!name||!duty||!ids.length){$('#dept-error').textContent='请填写名称和职责，并至少选择一位 Agent。';return}if(departments.some(d=>d.name===name)){$('#dept-error').textContent='已有同名部门，请使用其他名称。';return}const id='d'+Date.now();departments.push({id,name,duty,agents:ids});selected=id;expanded.add(id);view='office';$('#modal').close();render();$('#status').textContent='部门已创建（本地）'}});
$('#request').addEventListener('input',()=>$('#request').setCustomValidity(''));
$('.tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();view=e.key==='Home'?'office':e.key==='End'?'work':view==='office'?'work':'office';renderMain();$('#'+view+'-tab').focus()});
$('#date').textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric'}).format(new Date());
render();
</script>
</body>
</html>
