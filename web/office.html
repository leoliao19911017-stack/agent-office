<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>办公室 · Soda Office</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/office.css">
  <script type="module" src="/office.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/office" aria-label="Soda Office 办公室">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span>Soda<span class="brand-accent"> Office</span></span>
    </a>
    <nav class="top-links" aria-label="中央视图">
      <a href="#floor" data-view="floor" aria-current="page"><span class="nav-icon floor-icon" aria-hidden="true"></span>办公室</a>
      <a href="#projects" data-view="projects"><span class="nav-icon projects-icon" aria-hidden="true"></span>项目</a>
      <a href="#focus" data-view="focus"><span class="nav-icon focus-icon" aria-hidden="true"></span>EaseDraw</a>
    </nav>
    <button type="button" class="sync" id="refresh" title="立即刷新">
      <span class="lamp" id="sync-lamp" aria-hidden="true"></span>
      <span id="sync-label" role="status">连接中</span><span aria-hidden="true">↻</span>
    </button>
  </header>

  <main class="shell">
    <aside class="sidebar" aria-label="工作台导航">
      <div class="rail-heading"><a class="section-label rail-title" href="#projects">项目</a><span class="num" id="nav-project-count">—</span></div>
      <nav class="rail-projects" id="rail-projects" aria-label="快速查看项目"><p class="muted">正在读取项目…</p></nav>
      <div class="rail-divider"></div>
      <div class="rail-heading"><p class="section-label">Agent 名册</p><span class="num" id="roster-count">—</span></div>
      <div class="roster" id="roster"><p class="muted">正在读取名册…</p></div>
      <div class="rail-bottom">
        <a class="rail-link" href="/board-cromma.html#board">任务看板 <span aria-hidden="true">↗</span></a>
        <a class="rail-link" href="/#/agents">管理 Agent <span aria-hidden="true">↗</span></a>
        <a class="rail-link" href="/#/pro">高级工作台 <span aria-hidden="true">↗</span></a>
      </div>
    </aside>

    <div class="workspace" id="workspace">
      <div class="page-heading" id="page-heading">
        <div><time class="section-label date-line" id="today"></time><h1 id="page-title" tabindex="-1">办公室</h1></div>
        <dl class="summary" aria-label="项目概况">
          <div><dt>进行中</dt><dd id="running-count">—</dd></div>
          <div><dt>待拍板</dt><dd id="decision-count">—</dd></div>
          <div><dt>已完成</dt><dd id="completed-count">—</dd></div>
        </dl>
      </div>

      <section class="floor panel" id="floor-section" aria-labelledby="floor-title">
        <div class="panel-head">
          <div><h2 id="floor-title">Agent 工位</h2><p class="muted">点一下工位，看看同事在忙什么。</p></div>
          <span class="floor-count" id="floor-count">—</span>
        </div>
        <div class="floor-plan">
          <div class="floor-edge" aria-hidden="true"></div>
          <div class="desks" id="desks"><p class="empty">正在读取工位…</p></div>
        </div>
        <div class="legend" aria-label="工位状态图例">
          <span><i class="lamp" data-tone="active"></i>执行中</span>
          <span><i class="lamp" data-tone="idle"></i>待命</span>
          <span><i class="lamp" data-tone="attention"></i>待处理</span>
          <span><i class="lamp" data-tone="unknown"></i>状态未知</span>
        </div>
      </section>

      <section class="project-panel panel" id="project-section" aria-labelledby="projects-title">
        <div class="panel-head">
          <div><h2 id="projects-title">项目接力</h2><p class="muted">查看每个项目的工作流进度。</p></div>
          <a class="text-link" href="#projects" id="all-projects">全部项目 <span aria-hidden="true">→</span></a>
          <label class="filter" id="filter-wrap" hidden><span class="sr-only">筛选项目状态</span><select id="project-filter">
            <option value="all">全部状态</option><option value="open">未完成</option><option value="completed">已完成</option>
          </select></label>
        </div>
        <div id="project-list"><p class="empty">正在读取项目…</p></div>
      </section>

      <section class="focus-panel" id="focus-section" aria-labelledby="focus-title" hidden>
        <header class="focus-head">
          <div><h1 id="focus-title">专注画布</h1><p class="muted">EaseDraw · 逸刻</p></div>
          <div class="focus-actions">
            <button class="utility-button" id="focus-expand" type="button">全屏</button>
            <a class="text-link" href="https://luckyandease.com/easedraw" target="_blank" rel="noopener noreferrer">打开官网 <span aria-hidden="true">↗</span></a>
          </div>
        </header>
        <iframe id="focus-frame" title="EaseDraw 专注画布" data-src="/easedraw/index.html" allow="fullscreen"></iframe>
      </section>
    </div>

    <aside class="inbox" aria-label="主理人办公桌">
      <nav class="inspector-nav" aria-label="右侧面板">
        <button type="button" data-inspector="inbox" aria-pressed="true">工作桌</button>
        <button type="button" data-inspector="detail" aria-pressed="false" id="detail-tab" disabled>详情</button>
      </nav>
      <div class="inspector-stack" id="inbox-view">
      <section class="intake panel" aria-labelledby="intake-title">
        <h2 id="intake-title">发起需求</h2>
        <button class="start-button" type="button" data-action="create"><span aria-hidden="true">＋</span> 新建需求</button>
      </section>

      <section class="panel side-panel" aria-labelledby="inbox-title">
        <div class="side-heading"><h2 id="inbox-title">待我拍板</h2><span class="count-pill" id="inbox-count">—</span></div>
        <div id="decisions"><p class="muted">正在读取待决策事项…</p></div>
      </section>

      <section class="panel side-panel" aria-labelledby="activity-title">
        <div class="side-heading"><h2 id="activity-title">近期动态</h2></div>
        <div id="activity"><p class="muted">正在读取项目动态…</p></div>
      </section>
      </div>
      <section class="inspector-detail" id="detail-view" aria-labelledby="detail-title" hidden>
        <header><h2 id="detail-title" tabindex="-1"></h2><button class="utility-button" type="button" data-inspector="inbox" aria-label="返回工作桌">×</button></header>
        <div id="detail-body"></div>
      </section>
    </aside>
  </main>

  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-head"><h2 id="dialog-title" tabindex="-1"></h2><button type="button" id="close-dialog" aria-label="关闭">×</button></div>
    <div class="dialog-body" id="dialog-body"></div>
  </dialog>
</body>
</html>
